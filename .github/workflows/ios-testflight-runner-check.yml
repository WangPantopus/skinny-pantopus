name: iOS TestFlight runner check (temporary)

# Temporary, for the pull request that moves ios-beta.yml to Xcode 27.1 on the
# `xcode-27` image: runs that job's setup on the new image (Xcode, Ruby with the
# app's gems, XcodeGen, fastlane) without secrets or an upload. Removed before
# the pull request merges.

on:
  pull_request:
    paths:
      - .github/workflows/ios-beta.yml
      - .github/workflows/ios-testflight-runner-check.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend/apps/ios

jobs:
  runner-check:
    name: TestFlight setup on xcode-27
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_27.1.app

      - name: Show Xcode and iOS SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i -E 'ios|iphone'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: frontend/apps/ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Fastlane runs
        run: bundle exec fastlane --version
