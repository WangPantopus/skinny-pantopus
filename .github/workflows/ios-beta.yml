name: iOS Beta (TestFlight)

on:
  push:
    tags:
      - "ios-v*"
  workflow_dispatch:

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend/apps/ios

jobs:
  testflight:
    name: Upload to TestFlight
    runs-on: macos-15
    # The Release archive compiles file by file (project.yml): about 24 minutes
    # on this 7 GB runner. As one whole module it needs a 6.5–9 GB compiler
    # process and never finished here (ios-v2.0.0 runs 38988562672, 38993086079).
    timeout-minutes: 90
    environment: ios-release

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.2.app

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: frontend/apps/ios

      - name: Install XcodeGen
        run: brew install xcodegen

      # Secrets reach the shell through env, never through template
      # interpolation inside a script.
      - name: Write .env from secrets
        env:
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in STRIPE_PUBLISHABLE_KEY MATCH_GIT_URL MATCH_PASSWORD APP_STORE_CONNECT_KEY_ID \
                      APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_CONTENT APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || { echo "::error::Missing secret $name"; exit 1; }
            printf '%s=%s\n' "$name" "${!name}"
          done > .env

      # Launch-cut features this build switches back on (docs/launch-scope-flags-2026-10-01.md), from
      # the PANTOPUS_LAUNCH_FEATURES variable (repository or ios-release environment). Unset, every cut
      # feature stays hidden. `make bootstrap` copies the .env line into Config/Secrets.xcconfig.
      - name: Add launch keys
        env:
          PANTOPUS_LAUNCH_FEATURES: ${{ vars.PANTOPUS_LAUNCH_FEATURES }}
        run: |
          keys=$(tr -d '[:space:]' <<<"$PANTOPUS_LAUNCH_FEATURES" | tr '[:upper:]' '[:lower:]')
          [[ -n "$keys" ]] || { echo "No launch keys: every launch-cut feature stays hidden."; exit 0; }
          [[ "$keys" =~ ^[a-z_]+(,[a-z_]+)*$ ]] || { echo "::error::PANTOPUS_LAUNCH_FEATURES must be comma-separated launch keys, like mailbox"; exit 1; }
          known=$(sed -nE 's/^ *case ([A-Za-z]+) = "([a-z_]+)"$/\2/p; s/^ *case ([a-z]+)$/\1/p' Pantopus/Core/Environment/LaunchFeatures.swift)
          for key in ${keys//,/ }; do
            [[ "$key" == all ]] || grep -qx "$key" <<<"$known" || { echo "::error::Unknown launch key '$key' in PANTOPUS_LAUNCH_FEATURES"; exit 1; }
          done
          echo "PANTOPUS_LAUNCH_FEATURES=$keys" >> .env
          echo "Launch keys in this build: $keys"

      - name: Fastlane beta
        env:
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # Optional: with all three set, the lane uploads the build's dSYMs
          # to Sentry; with any of them unset it skips that step.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          FASTLANE_HIDE_CHANGELOG: "true"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: bundle exec fastlane beta
