name: Android Beta (Play Store)

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend/apps/android

jobs:
  play_internal:
    name: Upload AAB to Play Internal track
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: android-release

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: frontend/apps/android

      # Secrets reach the shell through env, never through template
      # interpolation inside a script.
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing secret ANDROID_KEYSTORE_BASE64}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > pantopus-release.jks

      # The committed app/google-services.json is a build placeholder. The
      # release app needs the Firebase config for app.pantopus.android or push
      # never arrives; the plugin prefers app/src/release/ over app/.
      - name: Write release Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          : "${GOOGLE_SERVICES_JSON:?Missing secret GOOGLE_SERVICES_JSON (Firebase config for app.pantopus.android)}"
          mkdir -p app/src/release
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/src/release/google-services.json
          node -e '
            const c = JSON.parse(require("fs").readFileSync("app/src/release/google-services.json", "utf8"));
            const ok = c.project_info && !/^0+$/.test(c.project_info.project_number || "0")
              && (c.client || []).some((x) => x.client_info?.android_client_info?.package_name === "app.pantopus.android");
            if (!ok) { console.error("GOOGLE_SERVICES_JSON is not a real Firebase config for app.pantopus.android"); process.exit(1); }'

      - name: Write .env + signing properties
        env:
          PANTOPUS_API_BASE_URL: ${{ secrets.PANTOPUS_API_BASE_URL }}
          PANTOPUS_SOCKET_URL: ${{ secrets.PANTOPUS_SOCKET_URL }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          PANTOPUS_KEYSTORE_PASSWORD: ${{ secrets.PANTOPUS_KEYSTORE_PASSWORD }}
          PANTOPUS_KEY_ALIAS: ${{ secrets.PANTOPUS_KEY_ALIAS }}
          PANTOPUS_KEY_PASSWORD: ${{ secrets.PANTOPUS_KEY_PASSWORD }}
        run: |
          cat > .env <<ENV
          PANTOPUS_API_BASE_URL=$PANTOPUS_API_BASE_URL
          PANTOPUS_SOCKET_URL=$PANTOPUS_SOCKET_URL
          STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY
          MAPS_API_KEY=$MAPS_API_KEY
          PANTOPUS_KEYSTORE_FILE=$(pwd)/pantopus-release.jks
          PANTOPUS_KEYSTORE_PASSWORD=$PANTOPUS_KEYSTORE_PASSWORD
          PANTOPUS_KEY_ALIAS=$PANTOPUS_KEY_ALIAS
          PANTOPUS_KEY_PASSWORD=$PANTOPUS_KEY_PASSWORD
          ENV

      - name: Write Play service account JSON
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          : "${PLAY_STORE_SERVICE_ACCOUNT_JSON:?Missing secret PLAY_STORE_SERVICE_ACCOUNT_JSON}"
          mkdir -p fastlane
          printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > fastlane/play-service-account.json

      - name: Fastlane beta
        run: bundle exec fastlane beta
