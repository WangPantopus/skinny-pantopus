name: iOS CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend/apps/ios

env:
  IOS_DERIVED_DATA_PATH: DerivedData
  IOS_SPM_PATH: SourcePackages
  IOS_SIMULATOR_OS: "18.5"

jobs:
  lint:
    name: Lint (SwiftLint + SwiftFormat)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned SwiftLint & SwiftFormat
        # `brew install` is unpinned: the hosted runners flip between bottles
        # (e.g. 0.63.2 flags `URL(string:)!` force-unwraps while 0.63.3 does
        # not), which broke this job in BOTH directions on successive runs.
        # Pin exact versions from the GitHub release binaries for determinism.
        # Keep these in sync with the versions used locally.
        env:
          SWIFTLINT_VERSION: "0.63.3"
          SWIFTFORMAT_VERSION: "0.61.1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pinned-tools"
          curl -fsSL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" -o "$RUNNER_TEMP/swiftlint.zip"
          unzip -o -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint-bin"
          install "$RUNNER_TEMP/swiftlint-bin/swiftlint" "$RUNNER_TEMP/pinned-tools/swiftlint"
          curl -fsSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o "$RUNNER_TEMP/swiftformat.zip"
          unzip -o -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat-bin"
          install "$RUNNER_TEMP/swiftformat-bin/swiftformat" "$RUNNER_TEMP/pinned-tools/swiftformat"
          # Put the pinned tools FIRST on PATH for the SwiftLint/SwiftFormat
          # steps so any swiftlint preinstalled on the runner can't shadow them.
          echo "$RUNNER_TEMP/pinned-tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pinned-tools/swiftlint" version
          "$RUNNER_TEMP/pinned-tools/swiftformat" --version

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: SwiftFormat (lint only)
        run: swiftformat --lint .

      # One of the two guards `make lint` runs locally: feature code goes
      # through the PantopusIcon enum. (verify-tokens.sh is not gated here
      # yet — it still reports a backlog of pre-existing literals.)
      - name: Icons go through PantopusIcon
        run: bash Pantopus/scripts/verify-icons.sh

      - name: Overline labels retain their text
        run: bash Pantopus/scripts/verify-overline.sh

      - name: No raw hex in feature code
        # Acceptance criterion #5 from Prompt P1 — feature code must use
        # `Theme.Color.*` tokens, never raw `#RRGGBB(AA)` literals (in code
        # or comments). Token files under `Pantopus/Core/Design/` are
        # exempt by design.
        run: |
          if grep -rnE '#[0-9a-fA-F]{6,8}' Pantopus/Features ; then
            echo "::error::Raw hex literals found in feature code. Use Theme.Color.* tokens instead."
            exit 1
          fi
          echo "✓ No raw hex literals in Pantopus/Features."

  build:
    name: Build iOS test bundles
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Xcode 16.4 ships with the iOS 18.5 simulator runtime
        # preinstalled on the macos-15 runner image; older 16.x bundles
        # may be missing their runtime, leading to "iOS X is not
        # installed" errors when xcodebuild looks for a destination.
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate project
        run: xcodegen generate

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: frontend/apps/ios/SourcePackages
          # v3 — workspace-local package clones avoid the wildcard
          # DerivedData restore path that previously failed on sentry-cocoa.
          key: spm-v3-${{ runner.os }}-${{ hashFiles('frontend/apps/ios/project.yml') }}
          restore-keys: |
            spm-v3-${{ runner.os }}-

      - name: Build tests once for the simulator matrix
        run: |
          set -o pipefail
          xcodebuild -project Pantopus.xcodeproj -scheme Pantopus \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath "$IOS_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$IOS_SPM_PATH" \
            -skipPackagePluginValidation -skipMacroValidation \
            -enableCodeCoverage YES \
            ARCHS="$(uname -m)" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY="-" \
            build-for-testing 2>&1 | tee xcodebuild-build.log | xcbeautify
      - name: Verify simulator host Keychain entitlement
        # Protected recovery uses the real Keychain in the hosted unit tests.
        # Ad-hoc simulator signing needs no certificate or provisioning profile.
        run: |
          python3 ../../../scripts/ios/verify-simulator-keychain-host.py \
            "$IOS_DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/Pantopus.app"
      - name: Package test products (preserve symlinks)
        run: tar -czf ios-test-products.tar.gz -C "$IOS_DERIVED_DATA_PATH" Build/Products
      - uses: actions/upload-artifact@v4
        with:
          name: ios-test-products
          path: frontend/apps/ios/ios-test-products.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Upload build diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: frontend/apps/ios/xcodebuild-build.log
          retention-days: 7

  test:
    name: Tests on ${{ matrix.simulator }}
    needs: build
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        simulator:
          - "iPhone 16"
          - "iPhone 16 Pro"
          - "iPhone SE (3rd generation)"
    steps:
      - uses: actions/checkout@v4
      - name: Select the same Xcode as the build job
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app
      - uses: actions/download-artifact@v4
        with:
          name: ios-test-products
          path: frontend/apps/ios
      - name: Restore test products
        run: |
          mkdir -p "$IOS_DERIVED_DATA_PATH"
          tar -xzf ios-test-products.tar.gz -C "$IOS_DERIVED_DATA_PATH"
      # Sanitised matrix entry → safe artifact + bundle name (no spaces /
      # parentheses). Used by the result-bundle path and the upload step.
      - name: Compute simulator slug
        id: sim
        run: |
          slug=$(echo "${{ matrix.simulator }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/-+$//')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Create simulator
        id: simulator
        run: |
          set -euo pipefail

          runtime_id=$(xcrun simctl list runtimes | awk -v os="${IOS_SIMULATOR_OS}" '
            $0 ~ "iOS " os && $0 !~ /unavailable/ {
              match($0, /com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+/)
              if (RSTART) {
                print substr($0, RSTART, RLENGTH)
                exit
              }
            }
          ')

          if [[ -z "${runtime_id}" ]]; then
            echo "::error::iOS ${IOS_SIMULATOR_OS} simulator runtime is not installed."
            xcrun simctl list runtimes
            exit 1
          fi

          device_type_id=$(xcrun simctl list devicetypes | awk -v name="${{ matrix.simulator }}" '
            index($0, name " (") == 1 {
              match($0, /com\.apple\.CoreSimulator\.SimDeviceType\.[^)]+/)
              if (RSTART) {
                print substr($0, RSTART, RLENGTH)
                exit
              }
            }
          ')

          if [[ -z "${device_type_id}" ]]; then
            echo "::error::Simulator device type '${{ matrix.simulator }}' is not installed."
            xcrun simctl list devicetypes
            exit 1
          fi

          device_id=$(xcrun simctl create "Pantopus CI ${{ steps.sim.outputs.slug }}" "${device_type_id}" "${runtime_id}")
          echo "udid=${device_id}" >> "$GITHUB_OUTPUT"
          echo "SIMULATOR_UDID=${device_id}" >> "$GITHUB_ENV"
          xcrun simctl boot "${device_id}" || true
          xcrun simctl bootstatus "${device_id}" -b
          echo "Using simulator '${{ matrix.simulator }}' (${device_id}) on ${runtime_id}."

      - name: Run prebuilt unit and snapshot tests
        # UI test injection is still a separately documented local check.
        # Simulator OS stays at 18.5 to preserve the reviewed snapshot baseline.
        run: |
          set -o pipefail
          test_run=$(find "$IOS_DERIVED_DATA_PATH/Build/Products" -name '*.xctestrun' -print -quit)
          test -n "$test_run"
          xcodebuild -xctestrun "$test_run" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -parallel-testing-enabled NO \
            -skip-testing:PantopusUITests \
            -resultBundlePath "TestResults-${{ steps.sim.outputs.slug }}.xcresult" \
            test-without-building 2>&1 | tee "xcodebuild-${{ steps.sim.outputs.slug }}.log"

      - name: Upload xcodebuild log on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ steps.sim.outputs.slug }}
          path: frontend/apps/ios/xcodebuild-${{ steps.sim.outputs.slug }}.log
          if-no-files-found: ignore

      - name: List available iOS simulators on failure
        if: failure() || cancelled()
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available iPhone

      - name: Extract coverage summary
        if: always()
        run: |
          set -e
          bundle="TestResults-${{ steps.sim.outputs.slug }}.xcresult"
          if [[ -d "$bundle" ]]; then
            echo "## iOS coverage — ${{ matrix.simulator }}" >> "$GITHUB_STEP_SUMMARY"
            xcrun xccov view --report --only-targets "$bundle" \
              | tee coverage-${{ steps.sim.outputs.slug }}.txt \
              | head -40 >> "$GITHUB_STEP_SUMMARY" || true
            xcrun xccov view --report --json "$bundle" \
              > coverage-${{ steps.sim.outputs.slug }}.json || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ steps.sim.outputs.slug }}
          path: |
            frontend/apps/ios/TestResults-${{ steps.sim.outputs.slug }}.xcresult
            frontend/apps/ios/coverage-${{ steps.sim.outputs.slug }}.txt
            frontend/apps/ios/coverage-${{ steps.sim.outputs.slug }}.json
          retention-days: 7

      - name: Delete simulator
        if: always() && steps.simulator.outputs.udid != ''
        run: |
          xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl delete "${{ steps.simulator.outputs.udid }}" || true
