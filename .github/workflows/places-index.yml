name: Places Index

# The public places index the Plans place picker reads (backend/services/plans/placesIndex.js): every US
# OpenStreetMap extract from Geofabrik, filtered to the picker's places and published as two files on the
# `places-index` release. Monthly, and by hand. A pull request that changes the build checks it on two small
# extracts and publishes nothing.

on:
  schedule:
    - cron: "23 10 3 * *"
  workflow_dispatch:
    inputs:
      regions:
        description: "Geofabrik ids, comma separated (empty: every us/* extract)"
        required: false
        default: ""
      publish:
        description: "Publish to the places-index release (master only)"
        type: boolean
        default: true
  pull_request:
    paths:
      - scripts/places/**
      - backend/services/plans/placesIndexFormat.js
      - .github/workflows/places-index.yml

permissions:
  contents: read

concurrency:
  group: places-index-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the index
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install osmium
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          osmium --version | head -1

      - name: Build
        env:
          REGIONS: ${{ github.event_name == 'pull_request' && 'us/rhode-island,us/district-of-columbia' || inputs.regions }}
        run: |
          # Each extract (California's is ~1.3 GB) is downloaded, filtered and deleted in turn.
          work="$RUNNER_TEMP/places-work"
          mkdir -p "$work"
          df -h "$RUNNER_TEMP"
          node --max-old-space-size=8192 scripts/places/build-index.cjs --out "$RUNNER_TEMP/places-index" \
            --work "$work" ${REGIONS:+--regions "$REGIONS"}
          rm -rf "$work"
          ls -la "$RUNNER_TEMP/places-index"

      - uses: actions/upload-artifact@v6
        with:
          name: places-index
          path: ${{ runner.temp }}/places-index
          retention-days: 7

  publish:
    name: Publish the index
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: places-index
          path: ${{ runner.temp }}/places-index

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/places/publish-index.sh "$RUNNER_TEMP/places-index"
