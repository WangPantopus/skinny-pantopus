name: CI

# CI OK is the required check for every surface, including reusable mobile jobs.
# Only job-level conditions skip unrelated work; the aggregate always reports.

on:
  pull_request:
  push:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ─── Which surfaces did this PR touch? ─────────────────────────────────────
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      seeder: ${{ steps.filter.outputs.seeder }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'scripts/deploy/**'
              - '.dockerignore'
              - 'docker-compose*.yml'
              - 'backend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
            web:
              - 'frontend/apps/web/**'
              - 'frontend/packages/**'
              - 'frontend/tsconfig.base.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/**'
            ios:
              - 'frontend/apps/ios/**'
              - '.github/workflows/**'
            android:
              - 'frontend/apps/android/**'
              - '.github/workflows/**'
            seeder:
              - 'pantopus-seeder/**'
              - '.github/workflows/**'

  # ─── Backend: privacy gates + Jest ─────────────────────────────────────────
  backend:
    name: Backend (privacy gates + Jest)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # P0.7 — Privacy gates (Audience Profile design v2 §13 + §16):
      # serializer forbidden-keys contract, notification cross-context
      # harness, and the source-level grep guards. Separate step so a
      # privacy regression surfaces with a clear label.
      - name: Privacy gates
        working-directory: backend
        run: pnpm run test:privacy

      - name: Jest
        working-directory: backend
        run: pnpm test

  # ─── Backend: the production Docker image still builds ─────────────────────
  # Validate the production image before any commit is eligible for deployment.
  backend-image:
    name: Backend Docker image
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production target (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: production
          push: false
          load: true
          tags: pantopus-ci/backend:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Exercise production image readiness
        run: docker run --rm --entrypoint node -v "$PWD/scripts/deploy/check-image.cjs:/checks.cjs:ro" pantopus-ci/backend:check /checks.cjs

  # ─── Web: lint, typecheck gate, Jest ───────────────────────────────────────
  web:
    name: Web (lint, typecheck gate, Jest)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm --filter (not turbo) so dependency packages without an
      # eslint config are not linted.
      - name: Lint
        run: pnpm --filter=@pantopus/web lint

      # Fails only on type errors that are not in tsc-baseline.json. The
      # baseline is empty, so today this is a plain `tsc --noEmit` gate;
      # see frontend/apps/web/scripts/typecheck-gate.mjs.
      - name: Typecheck gate
        run: pnpm --filter=@pantopus/web type-check:gate

      - name: Jest
        run: pnpm --filter=@pantopus/web test

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter=@pantopus/web build

  # ─── Web: Identity Firewall end-to-end (Playwright, API fully mocked) ──────
  web-e2e:
    name: Web E2E (Identity Firewall)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm --filter=@pantopus/web exec playwright install --with-deps chromium

      # The spec mocks every backend call with page.route, so no API server
      # is needed; playwright.config.ts starts `next dev` itself.
      - name: Playwright (chromium)
        working-directory: frontend/apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm exec playwright test tests/e2e/identity-firewall.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/apps/web/playwright-report/
          retention-days: 7

  # ─── Seeder: pytest ────────────────────────────────────────────────────────
  seeder:
    name: Seeder (pytest)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.seeder == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Matches the Lambda runtime in pantopus-seeder/deploy/template.yaml.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pantopus-seeder/requirements.txt
            pantopus-seeder/requirements-lambda.txt

      - name: Install dependencies
        run: python -m pip install -r pantopus-seeder/requirements.txt -r pantopus-seeder/requirements-lambda.txt

      - name: pytest
        working-directory: pantopus-seeder
        run: pytest tests/ -q

  ios:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true') }}
    uses: ./.github/workflows/ios-ci.yml

  android:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.android == 'true') }}
    uses: ./.github/workflows/android-ci.yml

  infrastructure:
    name: Deployment and migration safeguards
    outputs:
      database-mode: ${{ steps.database.outputs.mode }}
      database-cli: ${{ steps.database.outputs.cli }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/deploy/*.test.cjs scripts/db/*.test.cjs
      - name: Protect migration history
        id: database
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/db/check-migrations.cjs
          node -e 'const p=require("./supabase/migration-policy.json"); console.log("mode="+p.mode); console.log("cli="+p.cliVersion)' >> "$GITHUB_OUTPUT"
      - run: bash -n scripts/deploy/backend.sh scripts/deploy/remote.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Validate every workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=

  database:
    needs: infrastructure
    if: needs.infrastructure.outputs.database-mode == 'baselined'
    uses: ./.github/workflows/db-migrations-check.yml
    with:
      cli-version: ${{ needs.infrastructure.outputs.database-cli }}

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, backend, backend-image, web, web-e2e, seeder, ios, android, infrastructure, database]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
