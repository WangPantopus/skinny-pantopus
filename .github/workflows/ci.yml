name: CI

# Backend, web and seeder checks. Pull requests only run the jobs whose
# surface changed (paths are detected in the `changes` job); pushes to
# master and dev run everything. iOS and Android have their own workflows
# (ios-ci.yml, android-ci.yml) because they need different runners.
#
# `CI OK` is the single job to mark as a required status check on master:
# it fails if any job it depends on failed, and passes when they succeed
# or were skipped for an unrelated change.

on:
  pull_request:
  push:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ─── Which surfaces did this PR touch? ─────────────────────────────────────
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      seeder: ${{ steps.filter.outputs.seeder }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            web:
              - 'frontend/apps/web/**'
              - 'frontend/packages/**'
              - 'frontend/tsconfig.base.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            seeder:
              - 'pantopus-seeder/**'
              - '.github/workflows/ci.yml'

  # ─── Backend: privacy gates + Jest ─────────────────────────────────────────
  backend:
    name: Backend (privacy gates + Jest)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # P0.7 — Privacy gates (Audience Profile design v2 §13 + §16):
      # serializer forbidden-keys contract, notification cross-context
      # harness, and the source-level grep guards. Separate step so a
      # privacy regression surfaces with a clear label.
      - name: Privacy gates
        working-directory: backend
        run: pnpm run test:privacy

      - name: Jest
        working-directory: backend
        run: pnpm test

  # ─── Backend: the production Docker image still builds ─────────────────────
  # Pull requests only. On master the image is built and pushed for real by
  # deploy-backend.yml, so building it here would be duplicate work.
  backend-image:
    name: Backend Docker image
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production target (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Web: lint, typecheck gate, Jest ───────────────────────────────────────
  web:
    name: Web (lint, typecheck gate, Jest)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm --filter (not turbo) so dependency packages without an
      # eslint config are not linted.
      - name: Lint
        run: pnpm --filter=@pantopus/web lint

      # Fails only on type errors that are not in tsc-baseline.json. The
      # baseline is empty, so today this is a plain `tsc --noEmit` gate;
      # see frontend/apps/web/scripts/typecheck-gate.mjs.
      - name: Typecheck gate
        run: pnpm --filter=@pantopus/web type-check:gate

      - name: Jest
        run: pnpm --filter=@pantopus/web test

  # ─── Web: Identity Firewall end-to-end (Playwright, API fully mocked) ──────
  web-e2e:
    name: Web E2E (Identity Firewall)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm --filter=@pantopus/web exec playwright install --with-deps chromium

      # The spec mocks every backend call with page.route, so no API server
      # is needed; playwright.config.ts starts `next dev` itself.
      - name: Playwright (chromium)
        working-directory: frontend/apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm exec playwright test tests/e2e/identity-firewall.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/apps/web/playwright-report/
          retention-days: 7

  # ─── Seeder: pytest ────────────────────────────────────────────────────────
  seeder:
    name: Seeder (pytest)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.seeder == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Matches the Lambda runtime in pantopus-seeder/deploy/template.yaml.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pantopus-seeder/requirements.txt
            pantopus-seeder/requirements-lambda.txt

      - name: Install dependencies
        run: python -m pip install -r pantopus-seeder/requirements.txt -r pantopus-seeder/requirements-lambda.txt

      - name: pytest
        working-directory: pantopus-seeder
        run: pytest tests/ -q

  # ─── Aggregate: the one required status check ──────────────────────────────
  ci-ok:
    name: CI OK
    if: ${{ !cancelled() }}
    needs: [changes, backend, backend-image, web, web-e2e, seeder]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          echo "backend:       ${{ needs.backend.result }}"
          echo "backend-image: ${{ needs.backend-image.result }}"
          echo "web:           ${{ needs.web.result }}"
          echo "web-e2e:       ${{ needs.web-e2e.result }}"
          echo "seeder:        ${{ needs.seeder.result }}"
      - name: Fail if any job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
