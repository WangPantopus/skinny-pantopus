name: DB migrations check
on:
  workflow_call:
    inputs:
      cli-version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  replay:
    name: Replay and lint the complete schema
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install backend integration dependencies
        run: pnpm --filter pantopus-backend... install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ inputs.cli-version }}
      - name: Replay from an empty database
        # ghcr.io can refuse the Supabase images ("toomanyrequests"; GitHub incident on 2026-09-23 failed every
        # replay for over an hour). Retry once with the same images from the public ECR mirror; the later steps
        # (supabase test db, supabase stop) then use that registry too.
        run: |
          if ! supabase db start; then
            echo "::warning::supabase db start failed; retrying with the public ECR image registry"
            supabase stop --no-backup || true
            echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws" >> "$GITHUB_ENV"
            SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws supabase db start
          fi
      - name: Reject invalid database functions
        run: node scripts/db/check-function-lint.cjs
      - name: Run SQL contracts
        run: |
          node scripts/db/sync-sql-contracts.cjs --check
          supabase test db
      - name: Verify canonical schema through PostgREST and the Following service
        working-directory: backend
        env:
          PANTOPUS_BASELINE_CONTRACT: '1'
        run: node --test tests/contract/baseline.postgrest.test.cjs
      - name: Stop this job's local database
        if: always()
        run: supabase stop --no-backup
