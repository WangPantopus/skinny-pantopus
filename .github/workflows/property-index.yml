name: Property Index

# Pantopus's own index of public county property records (backend/services/propertyRecords, scripts/property-index),
# published to private storage. Weekly for Clark County's weekly file and the counties whose records stop serving 60 days
# after their date, monthly for the rest, and by hand, with the labeled national estimates in their own index beside it,
# by hand (they change yearly). After every build, the refresh watch says in the run's summary which live counties are
# near the date their records stop serving and which scheduled builds never came, and fails the run when one needs
# someone. This repository is public, so its logs and uploaded artifacts are too: a real county's run prints counts only
# and uploads nothing here, and only master can reach the storage key. A pull request builds a made-up county and
# publishes nothing.

on:
  schedule:
    # Wednesdays: Clark County writes its file on Tuesdays, and the live counties whose records stop serving 60 days after
    # their date (Stark first) get about eight tries before then. A run publishes only a county whose file changed.
    - cron: "23 13 * * 3"
    - cron: "41 14 9 * *"
    # The statewide files, in groups that fit one run. Not tx-stratmap: its site refuses GitHub's servers.
    - cron: "17 3 10 * *"
    - cron: "17 3 11 * *"
    - cron: "17 3 12 * *"
    # The county connectors, in groups that fit one run.
    - cron: "17 3 13 * *"
    - cron: "17 3 14 * *"
    - cron: "17 3 15 * *"
    - cron: "17 3 16 * *"
    - cron: "17 3 17 * *"
    - cron: "17 3 18 * *"
    - cron: "17 3 19 * *"
    # The statewide files, then the county connectors, that joined the schedule in November.
    - cron: "17 3 20 * *"
    - cron: "17 3 21 * *"
    # FHFA's yearly price index: out by the end of March, and a second try in May.
    - cron: "29 5 12 4,5 *"
  workflow_dispatch:
    inputs:
      action:
        description: "build; rollback one county to its previous release; switch one county off, shadow or live; or shared-facts, with county and mode live or off (an address with several homes on record shows what all its records agree on); or similar-homes, with county and mode live or off (a house's owner sees its county value beside similar houses on its street); or new-columns / derived-rows / measured-rows, with county and mode live or off (a live county shows the columns its connector newly reads / the rows derived from its record / figures measured from building outlines and parcel maps where its record has none, held off until then); or listed-units, with county and mode live or off (someone who names a unit an address list gives a condo finds that home); or past-date, with county and mode live or off (a live county past its release's date keeps answering from that release, saying how old it is); or estimates, or floor-points, the floor by location (sources are state codes); or area-trends (FHFA's yearly file); or models (refit each county's value model from the release it serves); or gaps (the missing-facts ledger, which follows every publish by itself: county names counties, all redoes every one, blank does releases without one)"
        type: choice
        options: [build, rollback, switch, shared-facts, similar-homes, appeal-packet, new-columns, derived-rows, measured-rows, listed-units, past-date, estimates, floor-points, area-trends, models, gaps]
        default: build
      sources:
        description: "Connectors in scripts/property-index/sources, space separated (build), or state codes (estimates, floor-points)"
        required: false
        default: "wa-clark"
      moved:
        description: "County FIPS changing source, as from a statewide file to a connector of their own, space separated (build): a county another source serves is refused unless named here, and only their record counts compare with what's serving"
        required: false
        default: ""
      county:
        description: "County FIPS (rollback); one or a comma separated list (switch, shared-facts, similar-homes, appeal-packet, new-columns, derived-rows, measured-rows, listed-units, past-date, models; all refits every county; build with accept_falls: the only counties that accept falls, and may also publish far fewer records, never a live one)"
        required: false
        default: ""
      state:
        description: "Its state, two letters (rollback)"
        required: false
        default: ""
      target:
        description: "The environment that follows the change (switch, shared-facts, similar-homes, appeal-packet, new-columns, derived-rows, measured-rows, listed-units, past-date)"
        type: choice
        options: [staging, production]
        default: staging
      mode:
        description: "off, shadow or live; blank keeps it (switch). live or off (shared-facts, similar-homes, appeal-packet, new-columns, derived-rows, measured-rows, listed-units, past-date)"
        required: false
        default: ""
      withhold:
        description: "Facts to keep off its screens, comma separated; none brings them back; blank keeps them (switch)"
        required: false
        default: ""
      accept_falls:
        description: "Publish lower fill and changed account ids, after reading what a run refused and only if a connector's fix or the county's own change meant them (build): for the counties named in county only, or for every county of the run when county is blank"
        type: boolean
        default: false
      estimates:
        description: "on or off: a live county's owners see a Pantopus value estimate; blank keeps it (switch)"
        required: false
        default: ""
  pull_request:
    paths:
      - scripts/property-index/**
      - backend/services/propertyRecords/addressKey.js
      - backend/services/propertyRecords/estimateFacts.js
      - backend/services/propertyRecords/facts.js
      - backend/services/propertyRecords/format.js
      - backend/services/propertyRecords/identity.js
      - backend/services/propertyRecords/registryFormat.js
      - backend/services/propertyRecords/structurePoints.js
      - backend/services/propertyRecords/valueModel.js
      - .github/workflows/property-index.yml

permissions:
  contents: read

# A county's switch only writes its own file, so it never waits behind a build that takes hours. Shared facts write the same file, so they share its line. The national floor writes only under its own prefix and can take hours a state, so it has its own line too. So does a rollback: on the publish line it would wait behind a build of up to 340 minutes, and publish.cjs keeps a rollback that lands while a state's files upload. A waiting run is
# replaced by a newer one, so several counties go in one run's list, not in a loop of runs. The missing-facts ledger by hand only
# reads releases and writes its own files, so it has its own line and never replaces a waiting build.
concurrency:
  group: property-index-${{ github.event_name == 'pull_request' && github.ref || ((inputs.action == 'switch' || inputs.action == 'shared-facts' || inputs.action == 'similar-homes' || inputs.action == 'appeal-packet' || inputs.action == 'new-columns' || inputs.action == 'derived-rows' || inputs.action == 'measured-rows' || inputs.action == 'listed-units' || inputs.action == 'past-date') && 'switch') || (inputs.action == 'estimates' && 'estimates') || (inputs.action == 'floor-points' && 'floor-points') || (inputs.action == 'rollback' && 'rollback') || (inputs.action == 'gaps' && 'gaps') || 'publish' }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the build on a made-up county
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # The build needs no packages (no pnpm install, so no package cache).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build and read back
        run: |
          node scripts/property-index/build.cjs --source synthetic --out "$RUNNER_TEMP/property-index"
          node scripts/property-index/check-synthetic.cjs "$RUNNER_TEMP/property-index"
          node scripts/property-index/gaps.cjs --root "$RUNNER_TEMP/property-index" --all
          node scripts/property-index/refresh-watch.cjs --check-schedule
      # The real connectors need the network and their real files, which a pull request never reads. They must still load.
      - name: Every connector loads
        run: |
          for source in scripts/property-index/sources/*.cjs; do
            node --disable-warning=ExperimentalWarning -e "require('./$source')"
          done

  switch:
    name: Switch a county
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'switch' || inputs.action == 'shared-facts' || inputs.action == 'similar-homes' || inputs.action == 'appeal-packet' || inputs.action == 'new-columns' || inputs.action == 'derived-rows' || inputs.action == 'measured-rows' || inputs.action == 'listed-units' || inputs.action == 'past-date') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: property-index
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PROPERTY_INDEX_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROPERTY_INDEX_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.PROPERTY_INDEX_REGION }}
      PROPERTY_INDEX_BUCKET: ${{ vars.PROPERTY_INDEX_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Change the county's line
        env:
          COUNTY: ${{ inputs.county }}
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          WITHHOLD: ${{ inputs.withhold }}
          ESTIMATES: ${{ inputs.estimates }}
          # shared-facts, similar-homes, appeal-packet, new-columns, derived-rows, measured-rows, listed-units and past-date each change only their own list in the file, never the county's own line.
          LIST: ${{ (inputs.action == 'shared-facts' && '--shared-facts') || (inputs.action == 'similar-homes' && '--similar-homes') || (inputs.action == 'appeal-packet' && '--appeal-packet') || (inputs.action == 'new-columns' && '--new-columns') || (inputs.action == 'derived-rows' && '--derived-rows') || (inputs.action == 'measured-rows' && '--measured-rows') || (inputs.action == 'listed-units' && '--listed-units') || (inputs.action == 'past-date' && '--past-date') || '' }}
        run: node scripts/property-index/switch-county.cjs --county "$COUNTY" --mode "$MODE" --target "$TARGET" --withhold "$WITHHOLD" --estimates "$ESTIMATES" --bucket "$PROPERTY_INDEX_BUCKET" $LIST

  publish:
    name: Build and publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && inputs.action != 'switch' && inputs.action != 'shared-facts' && inputs.action != 'similar-homes' && inputs.action != 'appeal-packet' && inputs.action != 'listed-units' && inputs.action != 'past-date' && inputs.action != 'new-columns' && inputs.action != 'derived-rows' && inputs.action != 'measured-rows'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    environment: property-index
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PROPERTY_INDEX_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROPERTY_INDEX_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.PROPERTY_INDEX_REGION }}
      PROPERTY_INDEX_BUCKET: ${{ vars.PROPERTY_INDEX_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Roll back
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
        env:
          COUNTY: ${{ inputs.county }}
          STATE_CODE: ${{ inputs.state }}
        run: node scripts/property-index/publish.cjs --rollback "$COUNTY" --state "$STATE_CODE" --bucket "$PROPERTY_INDEX_BUCKET"
      - name: Build and publish
        if: (github.event_name != 'workflow_dispatch' && github.event.schedule != '29 5 12 4,5 *') || inputs.action == 'build'
        env:
          SOURCES: ${{ inputs.sources || (github.event.schedule == '23 13 * * 3' && 'oh-stark wa-clark pa-cumberland ok-oklahoma co-adams co-denver dc-dc fl-miami-dade pa-allegheny co-boulder wa-kitsap') || (github.event.schedule == '17 3 10 * *' && 'ma-massgis ct-cama md-sdat nj-modiv ny-parcels') || (github.event.schedule == '17 3 11 * *' && 'tx-harris tx-tarrant tx-williamson ut-lir') || (github.event.schedule == '17 3 12 * *' && 'mn-parcels mn-dakota nc-onemap wv-parcels me-parcels mt-cadastral') || (github.event.schedule == '17 3 13 * *' && 'ca-los-angeles ca-san-bernardino ca-riverside ca-san-diego ca-san-francisco ca-san-joaquin ca-contra-costa') || (github.event.schedule == '17 3 14 * *' && 'il-cook pa-philadelphia pa-montgomery mi-oakland mi-detroit oh-franklin oh-cuyahoga oh-summit oh-montgomery oh-hamilton') || (github.event.schedule == '17 3 15 * *' && 'ok-tulsa mo-jackson ne-douglas tn-davidson nm-bernalillo fl-broward fl-hillsborough fl-sarasota fl-seminole nc-mecklenburg nc-guilford nc-wake') || (github.event.schedule == '17 3 16 * *' && 'or-rlis or-clackamas or-deschutes wa-pierce wi-milwaukee wi-madison mn-ramsey ny-monroe ga-dekalb va-charlottesville') || (github.event.schedule == '17 3 17 * *' && 'tx-bexar tx-travis tx-collin tx-denton tx-fort-bend tx-montgomery tx-hidalgo') || (github.event.schedule == '17 3 18 * *' && 'tx-cameron tx-nueces tx-taylor tx-kaufman tx-grayson tx-liberty tx-atascosa tx-bell tx-gregg tx-bastrop tx-smith tx-brazos tx-johnson tx-ector wa-skagit nc-lincoln') || (github.event.schedule == '17 3 19 * *' && 'ca-sonoma pa-berks va-chesterfield mo-st-charles va-henrico sc-york mo-st-louis-county nc-cumberland') || (github.event.schedule == '17 3 20 * *' && 'wi-parcels wa-parcels co-parcels id-parcels vt-parcels ny-rolls ny-county-files') || (github.event.schedule == '17 3 21 * *' && 'nv-clark nv-washoe co-el-paso ak-anchorage ca-solano ca-napa ca-santa-barbara co-broomfield co-mesa fl-alachua fl-duval fl-hernando fl-leon fl-manatee fl-martin fl-osceola fl-st-johns ia-woodbury mn-scott nc-carteret nc-iredell nc-onslow nc-sampson oh-ashtabula oh-clermont oh-delaware oh-fairfield oh-geauga oh-greene va-james-city va-montgomery va-roanoke wa-walla-walla') || 'tx-dallas fl-roll' }}
          # A run someone started by hand may bring back a file that was rolled back; the schedule never does.
          REPUBLISH: ${{ github.event_name == 'workflow_dispatch' && '--republish' || '' }}
          # Only a run someone starts by hand, and only when they say so: for the counties named in county alone when it names
          # any (so a yes for one county never carries a whole state's falls with it), otherwise for every county of the run.
          ACCEPT_FALLS: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_falls && !inputs.county && '--accept-falls' || '' }}
          ACCEPT_FOR: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_falls && inputs.county || '' }}
          MOVED: ${{ inputs.moved }}
          # With accept_falls only, the counties someone names may also publish far fewer records: a fix dropping records that
          # shouldn't exist. publish.cjs logs both counts and never lets a live county through.
          SHRINK: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_falls && inputs.county || '' }}
        run: |
          status=0
          # Each source's build and publish, and what happened to each county, for the refresh watch.
          outcomes="$RUNNER_TEMP/refresh-outcomes"
          mkdir -p "$outcomes"
          for source in $SOURCES; do
            out="$RUNNER_TEMP/property-index/$source"
            built=0
            published=0
            # What built still publishes; the run ends failed so someone looks.
            node --max-old-space-size=12288 scripts/property-index/build.cjs --source "$source" --out "$out" --work "$RUNNER_TEMP/property-index-work" || built=$?
            node scripts/property-index/publish.cjs --out "$out" --bucket "$PROPERTY_INDEX_BUCKET" $REPUBLISH $ACCEPT_FALLS ${ACCEPT_FOR:+--accept-falls-for "$ACCEPT_FOR"} ${MOVED:+--moved "$MOVED"} ${SHRINK:+--accept-shrink-for "$SHRINK"} --outcomes "$outcomes/counties.jsonl" || published=$?
            printf '%s\t%s\t%s\n' "$source" "$built" "$published" >> "$outcomes/builds.tsv"
            if [ "$built" != 0 ] || [ "$published" != 0 ]; then status=1; fi
            rm -rf "$out" "$RUNNER_TEMP/property-index-work/$source"
          done
          exit $status
      # What each source and county did, every live county within 30 days of the date its record stops serving, every scheduled
      # build that never came, and stored sources on no schedule, in this run's summary (scripts/property-index/refresh-watch.cjs).
      # A scheduled run fails, so GitHub emails, when a live county is 14 days or less from that date, a scheduled build is
      # overdue, or a live county's source is on no schedule; a run started by hand says the same as warnings. Each source's
      # last try goes to refresh/attempts.json beside the releases.
      - name: Refresh watch
        if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.action == 'build') || (github.event_name == 'schedule' && github.event.schedule != '29 5 12 4,5 *')) }}
        env:
          RED: ${{ github.event_name == 'schedule' && '--red' || '' }}
        run: node scripts/property-index/refresh-watch.cjs --bucket "$PROPERTY_INDEX_BUCKET" --outcomes "$RUNNER_TEMP/refresh-outcomes" --run "$GITHUB_RUN_ID" $RED
      # Each county's value model, fitted from the release it serves: for counties published before releases carried one
      # (blank: those), or after the model changes (all). No release changes and nothing goes live.
      - name: Fit value models
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'models'
        env:
          COUNTIES: ${{ inputs.county }}
        run: |
          case "$COUNTIES" in
            all) node --max-old-space-size=12288 scripts/property-index/fit-models.cjs --bucket "$PROPERTY_INDEX_BUCKET" --all ;;
            "") node --max-old-space-size=12288 scripts/property-index/fit-models.cjs --bucket "$PROPERTY_INDEX_BUCKET" ;;
            *) node --max-old-space-size=12288 scripts/property-index/fit-models.cjs --bucket "$PROPERTY_INDEX_BUCKET" --counties "$COUNTIES" ;;
          esac
      # The missing-facts ledger (scripts/property-index/gaps.cjs) follows each new release: every home it leaves a Property
      # details field empty on, beside the releases in private storage, with counts by county, kind and field. This log has
      # counts only. After a build or rollback, what was published goes first, and nothing starts after an hour: the next
      # run takes the rest. By hand: the counties named, all of them again (all, as after the rule changes), or blank.
      - name: Missing-facts ledger
        if: ${{ !cancelled() && (inputs.action == 'gaps' || inputs.action == 'build' || inputs.action == 'rollback' || (github.event_name == 'schedule' && github.event.schedule != '29 5 12 4,5 *')) }}
        env:
          COUNTIES: ${{ inputs.action == 'gaps' && inputs.county || '' }}
          BUDGET: ${{ inputs.action != 'gaps' && '60' || '' }}
        run: |
          case "$COUNTIES" in
            all) node --max-old-space-size=12288 scripts/property-index/gaps.cjs --bucket "$PROPERTY_INDEX_BUCKET" --all ;;
            "") node --max-old-space-size=12288 scripts/property-index/gaps.cjs --bucket "$PROPERTY_INDEX_BUCKET" ${BUDGET:+--budget-minutes "$BUDGET"} ;;
            *) node --max-old-space-size=12288 scripts/property-index/gaps.cjs --bucket "$PROPERTY_INDEX_BUCKET" --counties "$COUNTIES" ;;
          esac
      # The national floor's own index, under its own prefix. Large states need room: the runner's unused tools go first.
      - name: Build and publish estimates
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'estimates'
        env:
          STATES: ${{ inputs.sources }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          out="$RUNNER_TEMP/estimates"
          work="$RUNNER_TEMP/estimates-work"
          node scripts/property-index/build-estimates.cjs --areas --out "$out" --work "$work"
          aws s3 cp "$out/areas" "s3://$PROPERTY_INDEX_BUCKET/index/estimates/areas" --recursive --only-show-errors
          for state in $STATES; do
            rm -rf "$out"
            node --disable-warning=ExperimentalWarning --max-old-space-size=12288 scripts/property-index/build-estimates.cjs --states "$state" --out "$out" --work "$work"
            node scripts/property-index/publish.cjs --out "$out" --bucket "$PROPERTY_INDEX_BUCKET" --prefix index/estimates
            rm -rf "$work/us-structures/$state"
          done
      # The floor by location: every structure of a state by where it stands, marked by the address registry. A hand-started run
      # means a new registry or a new FEMA file, so it replaces what's serving. Its log has the wrong-building count per state.
      - name: Build and publish the floor by location
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'floor-points'
        env:
          STATES: ${{ inputs.sources }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          out="$RUNNER_TEMP/floor-points"
          work="$RUNNER_TEMP/floor-points-work"
          for state in $STATES; do
            rm -rf "$out"
            node --disable-warning=ExperimentalWarning --max-old-space-size=12288 scripts/property-index/build-estimates.cjs --points --registry "s3://$PROPERTY_INDEX_BUCKET/index/registry" --states "$state" --out "$out" --work "$work"
            node scripts/property-index/publish.cjs --out "$out" --bucket "$PROPERTY_INDEX_BUCKET" --prefix index/estimates/points --bulk --republish
            rm -rf "$work/us-structures/$state"
          done
      # The value card's area price change: one small file per state. A build that fails or looks wrong uploads nothing, and last year's stays.
      - name: Build and publish area trends
        if: inputs.action == 'area-trends' || github.event.schedule == '29 5 12 4,5 *'
        run: |
          out="$RUNNER_TEMP/area-trends"
          node scripts/property-index/build-area-trends.cjs --out "$out" --work "$RUNNER_TEMP/area-trends-work"
          aws s3 cp "$out/area-trends" "s3://$PROPERTY_INDEX_BUCKET/index/area-trends" --recursive --only-show-errors
