name: Address Registry

# Pantopus's own address registry (backend/services/propertyRecords/registry.js, scripts/property-index/build-registry.cjs),
# published to private storage beside the property index. Monthly, for Overture's monthly release and the National Address
# Database's quarterly one, and by hand. This repository is public, so its logs and uploaded artifacts are too: a real run
# prints counts only and uploads nothing here, and only master can reach the storage key. A pull request builds made-up
# addresses and publishes nothing.

on:
  schedule:
    - cron: "17 15 24 * *"
  workflow_dispatch:
    inputs:
      action:
        description: "build (publish = false only measures; T2 runs on every build), or rollback one county"
        type: choice
        options: [build, rollback]
        default: build
      sources:
        description: "Sources in scripts/property-index/sources/address, comma separated (build)"
        required: false
        default: "points,nad,overture,openaddresses"
      states:
        description: "State codes, comma separated, or empty for all (build)"
        required: false
        default: ""
      publish:
        description: "Publish what's built (build)"
        type: boolean
        default: true
      county:
        description: "County FIPS (rollback)"
        required: false
        default: ""
      state:
        description: "Its state, two letters (rollback)"
        required: false
        default: ""
  pull_request:
    paths:
      - scripts/property-index/**
      - backend/services/propertyRecords/addressKey.js
      - backend/services/propertyRecords/format.js
      - backend/services/propertyRecords/identity.js
      - backend/services/propertyRecords/registryFormat.js
      - .github/workflows/address-registry.yml

permissions:
  contents: read

concurrency:
  group: address-registry-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the registry build on made-up addresses
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # The build needs no packages (no pnpm install, so no package cache).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build and read back
        run: |
          node scripts/property-index/build-registry.cjs --sources synthetic --out "$RUNNER_TEMP/registry" --work "$RUNNER_TEMP/registry-work"
          node scripts/property-index/check-registry.cjs "$RUNNER_TEMP/registry"

  run:
    name: Build, check and publish, or roll back
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    environment: property-index
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PROPERTY_INDEX_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROPERTY_INDEX_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.PROPERTY_INDEX_REGION }}
      PROPERTY_INDEX_BUCKET: ${{ vars.PROPERTY_INDEX_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Roll back
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
        env:
          COUNTY: ${{ inputs.county }}
          STATE_CODE: ${{ inputs.state }}
        run: node scripts/property-index/publish.cjs --rollback "$COUNTY" --state "$STATE_CODE" --bucket "$PROPERTY_INDEX_BUCKET" --prefix index/registry
      - name: Make room
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'build'
        # The runner's tools take most of its disk; the National Address Database's zip is 8.5 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1
      - name: Install DuckDB
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'build'
        # Overture's addresses are Parquet files.
        run: |
          curl -fsSL -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          echo "6e89deac1ebbc36eed0291caf8b567b030c7b86ac35998f71854e22b3c5d5e2f  duckdb.zip" | sha256sum -c -
          unzip -q duckdb.zip -d "$RUNNER_TEMP/duckdb"
          echo "DUCKDB=$RUNNER_TEMP/duckdb/duckdb" >> "$GITHUB_ENV"
      - name: Build and publish
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'build'
        env:
          SOURCES: ${{ inputs.sources || 'points,nad,overture,openaddresses' }}
          STATES: ${{ inputs.states }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: bash scripts/property-index/run-registry.sh
