name: Deploy Backend
# A workflow_run job runs in the default branch's context, so GitHub lists every
# automatic run under master. The name says what the run releases;
# scripts/deploy/require-ci.cjs reads the commit back from it.
run-name: >-
  Deploy Backend to ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'master' && 'production' || 'staging' }}
  (${{ github.event.workflow_run.head_branch || github.ref_name }} ${{ github.event.workflow_run.head_sha || github.sha }})

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, dev]
  workflow_dispatch:

# Shared with rollback, including database writes. Never interrupt a rollout.
concurrency:
  group: backend-${{ (github.event.workflow_run.head_branch || github.ref_name) == 'master' && 'production' || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  preflight:
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')) ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      target: ${{ steps.ci.outputs.target }}
      deploy: ${{ steps.ci.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Require CI on the current branch head or an overdue commit
        id: ci
        uses: actions/github-script@v8
        with:
          script: await require('./scripts/deploy/require-ci.cjs')({github, context, core})

  release:
    name: Release backend
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: ${{ needs.preflight.outputs.target }}
    outputs:
      signin: ${{ steps.signin.outputs.result }}
      signin_message: ${{ steps.signin.outputs.message }}
    steps:
      - name: Check configuration
        id: configuration
        env:
          ENABLED: ${{ vars.BACKEND_DEPLOY_ENABLED }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          if [[ "$ENABLED" != true ]]; then
            echo '::notice::Backend deployment is disabled. Follow docs/ci-cd.md to configure this environment.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN EC2_HOST EC2_USERNAME EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || { echo "::error::Missing environment secret: $name"; exit 1; }
          done
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.configuration.outputs.enabled == 'true'
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Recheck CI after environment approval
        if: steps.configuration.outputs.enabled == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await require('./scripts/deploy/require-ci.cjs')({github, context, core}, {recheck: true})
      # Read-only, and never stops the release: the "Sign-in settings match the
      # apps" job below reports it. It runs here because the Supabase secrets
      # belong to this environment, and a second job in the environment would
      # add a deployment record for require-ci.cjs to pass over.
      - name: Read this environment's sign-in settings
        id: signin
        if: steps.configuration.outputs.enabled == 'true'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/deploy/check-signin-settings.cjs
      # This job holds the registry, server and database secrets, so the actions GitHub doesn't publish
      # itself are pinned to the commit their version tag named on November 13, 2026: a tag can be moved
      # to other code, a commit can't. To update one, replace the commit and its version comment together.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.configuration.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.configuration.outputs.enabled == 'true'
      - name: Build immutable release image
        id: image
        if: steps.configuration.outputs.enabled == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: production
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pantopus-backend:commit-${{ needs.preflight.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ needs.preflight.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Read database adoption state
        id: database
        if: steps.configuration.outputs.enabled == 'true'
        run: |
          node scripts/db/check-migrations.cjs
          node -e 'const p=require("./supabase/migration-policy.json"); console.log("mode="+p.mode); console.log("cli="+p.cliVersion)' >> "$GITHUB_OUTPUT"
      # Its own step, so a failed migration push isn't mistaken for this switch.
      - name: Require database releases in this environment
        if: steps.database.outputs.mode == 'baselined'
        env:
          DB_MIGRATIONS_ENABLED: ${{ vars.DB_MIGRATIONS_ENABLED }}
        run: |
          [[ "$DB_MIGRATIONS_ENABLED" == true ]] || { echo "::error::Set DB_MIGRATIONS_ENABLED=true once this environment's database has the canonical migrations (docs/ci-cd.md)."; exit 1; }
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        if: steps.database.outputs.mode == 'baselined'
        with:
          version: ${{ steps.database.outputs.cli }}
      - name: Apply validated migrations before application rollout
        if: steps.database.outputs.mode == 'baselined'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_SESSION_POOLER_HOST: ${{ vars.SUPABASE_SESSION_POOLER_HOST }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?}" "${SUPABASE_DB_PASSWORD:?}" "${SUPABASE_PROJECT_ID:?}"
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          db_flags=(--project-ref "$SUPABASE_PROJECT_ID")
          if [[ -n "$SUPABASE_SESSION_POOLER_HOST" ]]; then
            [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ &&
               "$SUPABASE_SESSION_POOLER_HOST" =~ ^aws-[0-9]+-[a-z0-9-]+\.pooler\.supabase\.com$ ]] || {
              echo '::error::Use the project ref and shared session-pooler host from Supabase Connect.'
              exit 1
            }
            # The explicit session pooler supports IPv4. Keep the password out
            # of the URL and process arguments; the CLI reads libpq's env var.
            export PGPASSWORD="$SUPABASE_DB_PASSWORD"
            db_flags=(--db-url "postgresql://postgres.${SUPABASE_PROJECT_ID}@${SUPABASE_SESSION_POOLER_HOST}:5432/postgres")
          fi
          supabase db push "${db_flags[@]}" --dry-run --skip-vault
          supabase db push "${db_flags[@]}" --yes
      # A release that's overdue by now goes out anyway (scripts/deploy/require-ci.cjs).
      - name: Reject a superseded release before cutover
        id: cutover
        if: steps.configuration.outputs.enabled == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await require('./scripts/deploy/require-ci.cjs')({github, context, core}, {recheck: true})
      - name: Deploy API and worker
        if: steps.cutover.outputs.deploy == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEPLOY_TARGET: ${{ needs.preflight.outputs.target }}
          DEPLOY_API_BIND: ${{ vars.BACKEND_API_BIND }}
          DEPLOY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/pantopus-backend@${{ steps.image.outputs.digest }}
        run: bash scripts/deploy/remote.sh
      - name: Record release
        if: steps.cutover.outputs.deploy == 'true' && success()
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/pantopus-backend@${{ steps.image.outputs.digest }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: printf 'Commit `%s`\n\nImage `%s`\n' "$SHA" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

  # Red when the environment's Supabase sign-in settings don't accept the apps
  # this commit ships (scripts/deploy/check-signin-settings.cjs). The release
  # itself is the job above; this one only says what to change in Supabase.
  signin-settings:
    name: Sign-in settings match the apps
    needs: [preflight, release]
    if: always() && needs.release.outputs.signin != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report
        env:
          RESULT: ${{ needs.release.outputs.signin }}
          MESSAGE: ${{ needs.release.outputs.signin_message }}
          TARGET: ${{ needs.preflight.outputs.target }}
        run: |
          printf '%s sign-in settings: %s\n' "$TARGET" "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          case "$RESULT" in
            ok) echo "$MESSAGE" ;;
            unreadable) echo "::warning::Sign-in settings not checked in $TARGET. $MESSAGE" ;;
            *) echo "::error::Sign-in is broken in $TARGET. $MESSAGE"; exit 1 ;;
          esac
