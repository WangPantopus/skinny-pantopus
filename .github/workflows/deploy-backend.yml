name: Deploy Backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, dev]
  workflow_dispatch:

# Shared with rollback, including database writes. Never interrupt a rollout.
concurrency:
  group: backend-${{ (github.event.workflow_run.head_branch || github.ref_name) == 'master' && 'production' || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')) ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      target: ${{ steps.ci.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Require CI on the current branch head
        id: ci
        uses: actions/github-script@v7
        with:
          script: await require('./scripts/deploy/require-ci.cjs')({github, context, core})

  release:
    name: Release backend
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ needs.preflight.outputs.target }}
    steps:
      - name: Check configuration
        id: configuration
        env:
          ENABLED: ${{ vars.BACKEND_DEPLOY_ENABLED }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          if [[ "$ENABLED" != true ]]; then
            echo '::notice::Backend deployment is disabled. Follow docs/ci-cd.md to configure this environment.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN EC2_HOST EC2_USERNAME EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || { echo "::error::Missing environment secret: $name"; exit 1; }
          done
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.configuration.outputs.enabled == 'true'
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Recheck CI after environment approval
        if: steps.configuration.outputs.enabled == 'true'
        uses: actions/github-script@v7
        with:
          script: await require('./scripts/deploy/require-ci.cjs')({github, context, core})
      - uses: docker/login-action@v3
        if: steps.configuration.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: steps.configuration.outputs.enabled == 'true'
      - name: Build immutable release image
        id: image
        if: steps.configuration.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: production
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pantopus-backend:commit-${{ needs.preflight.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ needs.preflight.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Read database adoption state
        id: database
        if: steps.configuration.outputs.enabled == 'true'
        run: |
          node scripts/db/check-migrations.cjs
          node -e 'const p=require("./supabase/migration-policy.json"); console.log("mode="+p.mode); console.log("cli="+p.cliVersion)' >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v3
        if: steps.database.outputs.mode == 'baselined'
        with:
          version: ${{ steps.database.outputs.cli }}
      - name: Apply validated migrations before application rollout
        if: steps.database.outputs.mode == 'baselined'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          DB_MIGRATIONS_ENABLED: ${{ vars.DB_MIGRATIONS_ENABLED }}
        run: |
          [[ "$DB_MIGRATIONS_ENABLED" == true ]] || { echo '::error::Complete the database adoption runbook before enabling releases of the baselined stream.'; exit 1; }
          : "${SUPABASE_ACCESS_TOKEN:?}" "${SUPABASE_DB_PASSWORD:?}" "${SUPABASE_PROJECT_ID:?}"
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --linked --dry-run
          supabase db push --linked --yes
      - name: Reject a superseded release before cutover
        if: steps.configuration.outputs.enabled == 'true'
        uses: actions/github-script@v7
        with:
          script: await require('./scripts/deploy/require-ci.cjs')({github, context, core})
      - name: Deploy API and worker
        if: steps.configuration.outputs.enabled == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEPLOY_TARGET: ${{ needs.preflight.outputs.target }}
          DEPLOY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/pantopus-backend@${{ steps.image.outputs.digest }}
        run: bash scripts/deploy/remote.sh
      - name: Record release
        if: steps.configuration.outputs.enabled == 'true' && success()
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/pantopus-backend@${{ steps.image.outputs.digest }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: printf 'Commit `%s`\n\nImage `%s`\n' "$SHA" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
