<div id="pantopus-next-stage" aria-label="Pantopus product design concept">
  <style>
    #pantopus-next-stage { color-scheme: light dark; --pp-bg: light-dark(#f6f8fa,#111a23); --pp-surface: light-dark(#ffffff,#192632); --pp-text: light-dark(#192c3c,#edf4f8); --pp-muted: light-dark(#516676,#b0c1cf); --pp-line: light-dark(#dbe4ea,#344656); --pp-blue: light-dark(#036b9d,#94d9ff); --pp-blue-soft: light-dark(#e8f5fc,#213e52); --pp-green: light-dark(#25624e,#a1dfc4); --pp-green-soft: light-dark(#edf7f1,#213e35); --pp-error: light-dark(#ad382d,#ffb0a4); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size: 15px; line-height: 1.5; color: var(--pp-text); width:100%; }
    #pantopus-next-stage * { box-sizing:border-box; }
    #pantopus-next-stage .pp-caption { margin:0 auto 10px; max-width:460px; font-size:12px; color:var(--pp-muted); }
    #pantopus-next-stage .pp-app { max-width:460px; margin:0 auto; border:1px solid var(--pp-line); border-radius:24px; background:var(--pp-bg); overflow:hidden; }
    #pantopus-next-stage .pp-header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px 12px; background:var(--pp-surface); }
    #pantopus-next-stage .pp-brand { display:flex; align-items:center; gap:8px; font-size:17px; font-weight:500; letter-spacing:-.4px; }
    #pantopus-next-stage .pp-mark { display:grid; place-items:center; background:var(--pp-blue-soft); color:var(--pp-blue); border-radius:10px; width:30px; height:30px; font-family:Georgia,serif; font-style:italic; font-size:22px; }
    #pantopus-next-stage button, #pantopus-next-stage input, #pantopus-next-stage textarea, #pantopus-next-stage select { font:inherit; }
    #pantopus-next-stage button { cursor:pointer; }
    #pantopus-next-stage button:disabled { opacity:.5; cursor:default; }
    #pantopus-next-stage .pp-profile { border:1px solid var(--pp-line); background:var(--pp-surface); color:var(--pp-text); width:44px; height:44px; border-radius:50%; font-weight:500; }
    #pantopus-next-stage .pp-content { padding:20px; min-height:500px; }
    #pantopus-next-stage h1 { font-size:27px; line-height:1.2; font-weight:500; letter-spacing:-.7px; margin:4px 0 8px; }
    #pantopus-next-stage h2 { font-size:17px; font-weight:500; line-height:1.35; margin:0 0 6px; letter-spacing:-.15px; }
    #pantopus-next-stage p { margin:0 0 12px; }
    #pantopus-next-stage .pp-sub { color:var(--pp-muted); font-size:14px; }
    #pantopus-next-stage .pp-eyebrow { color:var(--pp-muted); font-size:12px; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
    #pantopus-next-stage .pp-eyebrow svg { width:14px; height:14px; }
    #pantopus-next-stage .pp-panel { background:var(--pp-surface); border:1px solid var(--pp-line); border-radius:16px; padding:17px; margin:17px 0; }
    #pantopus-next-stage .pp-primary-panel { border-color:var(--pp-line); background:var(--pp-blue-soft); }
    #pantopus-next-stage .pp-section-title { margin:23px 0 10px; font-size:13px; color:var(--pp-muted); font-weight:500; }
    #pantopus-next-stage .pp-button { min-height:44px; border:1px solid var(--pp-line); border-radius:10px; padding:9px 13px; background:var(--pp-surface); color:var(--pp-text); font-weight:500; display:inline-flex; align-items:center; justify-content:center; gap:7px; text-align:center; }
    #pantopus-next-stage .pp-button svg { width:17px; height:17px; }
    #pantopus-next-stage .pp-primary { background:var(--pp-blue); color:light-dark(#fff,#102535); border-color:var(--pp-blue); }
    #pantopus-next-stage .pp-full { width:100%; }
    #pantopus-next-stage .pp-link { min-height:44px; padding:8px 0; background:transparent; border:0; color:var(--pp-blue); text-align:left; display:inline-flex; align-items:center; gap:6px; }
    #pantopus-next-stage .pp-link svg { width:16px; height:16px; }
    #pantopus-next-stage .pp-actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:14px; }
    #pantopus-next-stage .pp-row { display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; min-height:68px; padding:12px 0; border:0; border-bottom:1px solid var(--pp-line); background:transparent; text-align:left; color:var(--pp-text); }
    #pantopus-next-stage .pp-row span { min-width:0; }
    #pantopus-next-stage .pp-row strong { font-weight:500; display:block; }
    #pantopus-next-stage .pp-row small { display:block; color:var(--pp-muted); font-size:12px; margin-top:3px; }
    #pantopus-next-stage .pp-row > svg { flex-shrink:0; width:18px; height:18px; color:var(--pp-muted); }
    #pantopus-next-stage .pp-label { display:block; margin:17px 0 7px; font-size:14px; font-weight:500; }
    #pantopus-next-stage input, #pantopus-next-stage textarea, #pantopus-next-stage select { width:100%; padding:11px; background:var(--pp-surface); color:var(--pp-text); border:1px solid var(--pp-line); border-radius:9px; font-size:16px; }
    #pantopus-next-stage textarea { min-height:118px; resize:vertical; }
    #pantopus-next-stage .pp-error { color:var(--pp-error); margin:9px 0; font-size:14px; }
    #pantopus-next-stage .pp-note { border-left:3px solid var(--pp-line); padding-left:12px; margin:15px 0; color:var(--pp-muted); font-size:13px; }
    #pantopus-next-stage .pp-status { display:flex; align-items:center; gap:6px; color:var(--pp-green); font-size:13px; margin:10px 0; }
    #pantopus-next-stage .pp-status svg { width:16px; height:16px; }
    #pantopus-next-stage .pp-author { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    #pantopus-next-stage .pp-avatar { display:grid; place-items:center; width:38px; height:38px; border-radius:12px; background:var(--pp-green-soft); color:var(--pp-green); font-size:14px; flex-shrink:0; }
    #pantopus-next-stage .pp-author small { display:block; font-size:12px; color:var(--pp-muted); }
    #pantopus-next-stage .pp-event { display:flex; align-items:flex-start; gap:12px; margin:15px 0; }
    #pantopus-next-stage .pp-date { background:var(--pp-blue-soft); border-radius:10px; color:var(--pp-blue); padding:8px 13px; text-align:center; font-size:11px; line-height:1.3; }
    #pantopus-next-stage .pp-date b { display:block; font-size:23px; font-weight:500; }
    #pantopus-next-stage .pp-tabs { display:flex; gap:6px; border-bottom:1px solid var(--pp-line); margin:15px 0; }
    #pantopus-next-stage .pp-tab { background:transparent; color:var(--pp-muted); border:0; border-bottom:2px solid transparent; min-height:44px; padding:9px 12px; }
    #pantopus-next-stage .pp-tab[aria-pressed=true] { color:var(--pp-blue); border-bottom-color:var(--pp-blue); }
    #pantopus-next-stage .pp-nav { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-top:1px solid var(--pp-line); padding:7px 8px 10px; background:var(--pp-surface); }
    #pantopus-next-stage .pp-nav button { position:relative; display:flex; flex-direction:column; align-items:center; gap:5px; border:0; border-radius:10px; padding:9px 2px; min-height:58px; background:transparent; color:var(--pp-muted); font-size:12px; }
    #pantopus-next-stage .pp-nav button[aria-current=page] { color:var(--pp-blue); background:var(--pp-blue-soft); }
    #pantopus-next-stage .pp-nav svg { width:21px; height:21px; }
    #pantopus-next-stage .pp-count { position:absolute; top:3px; right:18%; border-radius:9px; padding:0 5px; font-size:11px; background:var(--pp-blue); color:light-dark(#fff,#102535); }
    #pantopus-next-stage .pp-toast { padding:0 20px; font-size:13px; color:var(--pp-green); background:var(--pp-bg); }
    #pantopus-next-stage .pp-toast:not(:empty) { padding:10px 20px 15px; }
    #pantopus-next-stage .pp-empty { padding:20px 0; }
    #pantopus-next-stage .pp-detail-list { margin:14px 0; }
    #pantopus-next-stage .pp-detail-list div { padding:9px 0; border-bottom:1px solid var(--pp-line); }
    #pantopus-next-stage .pp-detail-list dt { font-size:12px; color:var(--pp-muted); }
    #pantopus-next-stage .pp-detail-list dd { margin:3px 0 0; }
    #pantopus-next-stage details { border-bottom:1px solid var(--pp-line); padding:14px 0; }
    #pantopus-next-stage summary { cursor:pointer; min-height:30px; }
    #pantopus-next-stage details p { margin:12px 0 0; font-size:13px; color:var(--pp-muted); }
    @media (max-width:370px) { #pantopus-next-stage .pp-content { padding:16px; } #pantopus-next-stage .pp-header { padding:14px 16px 10px; } #pantopus-next-stage h1 { font-size:25px; } #pantopus-next-stage .pp-button { padding:9px 11px; } }
  </style>
  <p class="pp-caption">Interactive design concept · Fictional people, schedules, and activity</p>
  <div class="pp-app">
    <header class="pp-header"><div class="pp-brand"><span class="pp-mark" aria-hidden="true">P</span>Pantopus</div><button type="button" class="pp-profile" data-action="profile" aria-label="Your profile and privacy">A</button></header>
    <main class="pp-content" id="pp-content"></main>
    <div class="pp-toast" id="pp-toast" role="status" aria-live="polite"></div>
    <nav class="pp-nav" id="pp-nav" aria-label="Primary navigation"></nav>
  </div>
  <script>
    (() => {
      const root = document.getElementById('pantopus-next-stage');
      const content = root.querySelector('#pp-content');
      const nav = root.querySelector('#pp-nav');
      const toast = root.querySelector('#pp-toast');
      const settings = { labels:'Plain language', situation:'Settling in' };
      const s = { view:'home', active:'home', task:'Kitchen tap is dripping', note:'The kitchen tap drips after I turn it off. Check whether the washer needs replacing.', done:false, draft:'', posted:false, postText:'', postFromTask:false, followed:false, eventSaved:false, replyRead:false, bookmark:false, inbox:'Updates', message:'', returnView:'home', eventOrigin:'following', askFromTask:false };
      const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
      const btn = (label,action,primary=false) => `<button type="button" class="pp-button ${primary?'pp-primary':''}" data-action="${action}">${label}</button>`;
      const back = (label,action) => `<button type="button" class="pp-link" data-action="${action}">${icon('arrow-left')}${label}</button>`;
      const status = text => `<div class="pp-status">${icon('check')}${text}</div>`;
      const row = (title,subtitle,action) => `<button type="button" class="pp-row" data-action="${action}"><span><strong>${title}</strong><small>${subtitle}</small></span>${icon('chevron-right')}</button>`;
      const author = () => `<div class="pp-author"><span class="pp-avatar">MR</span><span>Maya Reed<small>Community walks · Public Beacon</small></span></div>`;
      const quiet = () => settings.situation === 'Quiet neighborhood';
      const homeName = () => settings.situation === 'No home added' ? 'Personal space' : 'My home';
      function render() {
        toast.textContent = s.message;
        const labels = settings.labels === 'Plain language' ? ['Home','Nearby','Following','Inbox'] : ['Home','Pulse','Beacons','Inbox'];
        nav.innerHTML = ['home','nearby','following','inbox'].map((key,i) => `<button type="button" data-action="nav-${key}" ${s.active===key?'aria-current="page"':''}>${icon(['house','messages-square','radio','inbox'][i])}<span>${labels[i]}</span>${key==='inbox'&&s.posted&&!quiet()&&!s.replyRead?'<span class="pp-count">1</span>':''}</button>`).join('');
        let html='';
        if(s.view==='home') {
          html=`<div class="pp-eyebrow">${icon('lock-keyhole')}${homeName()} · Only you</div><h1>A little less to keep in mind.</h1><p class="pp-sub">Your plans and things to take care of.</p>`;
          html+=`<section class="pp-panel pp-primary-panel"><div class="pp-eyebrow">${s.done?'Completed':'Next up'} · Private task</div><h2>${esc(s.task)}</h2><p class="pp-sub">${s.done?'Kept in your task history.':s.posted&&s.postFromTask?'Your question is posted. Check the conversation for replies.':'Added by you. Keep notes here or ask your neighborhood for advice.'}</p>${btn('Open task','task',true)}</section>`;
          html+=`<div class="pp-section-title">Coming up</div>${settings.situation!=='No home added'?row('Recycling pickup','Wed, Sep 9 · Schedule entered by you','pickup'):'<p class="pp-sub">Personal plans work before you add a home.</p>'}${s.eventSaved?row('Welcome walk','Sat, Sep 12 · 10:00 AM · Private calendar','saved-event'):''}${s.followed&&!s.eventSaved?row('Welcome walk with Maya','From someone you follow · Review event','event'):''}<div class="pp-actions">${btn('View calendar','calendar')}</div><div class="pp-section-title">Keep useful things together</div>${row('Saved references',s.bookmark?'1 private bookmark':'Questions and updates you choose to keep','saved')}<details><summary>About ${settings.situation==='No home added'?'adding a home':'this home'}</summary><p>${settings.situation==='No home added'?'Saving an address would add reference information. Joining a shared household is a separate step.':'Address facts and household tools live here. A saved address does not give access to another household.'}</p></details>`;
        } else if(s.view==='task') {
          html=`${back('Home','nav-home')}<div class="pp-eyebrow">${icon('lock-keyhole')}Private task · Only you</div><h1>${esc(s.task)}</h1><p class="pp-sub">${s.done?'Completed by you.':'Open · No date set'}</p><div class="pp-panel"><h2>Your note</h2><p>${s.note?esc(s.note):'No details added.'}</p><div class="pp-note">This note stays private.</div></div>${s.posted&&s.postFromTask?row('Your neighborhood question','Posted separately · Open conversation','thread'):!s.posted?btn('Ask nearby for advice','ask-task',true):''}<div class="pp-actions">${btn(s.done?'Reopen task':'Mark task done','toggle-done')}</div><p class="pp-sub" style="margin-top:16px">Completing this task changes your private record.</p>`;
        } else if(s.view==='nearby') {
          html=`<div class="pp-eyebrow">${icon('map-pin')}Camas · Selected neighborhood</div><h1>Life nearby.</h1><p class="pp-sub">Questions, useful updates, and local plans.</p><div class="pp-actions">${btn(s.posted?'Open your question':'Ask a question',s.posted?'thread':'ask-nearby',true)}${btn('Explore people','nav-following')}</div>`;
          if(s.posted) html+=`<div class="pp-section-title">Your conversation</div>${row(esc(s.postText),quiet()?'Posted · Waiting for a reply':'1 reply · Neighborhood audience','thread')}`;
          if(quiet()) html+=`<section class="pp-panel"><h2>No ${s.posted?'other ':''}recent conversations here.</h2><p class="pp-sub">You can ${s.posted?'revisit your question':'start a question'} or explore public people to follow.</p></section>`;
          else html+=`<section class="pp-panel">${author()}<h2>A welcome walk this Saturday</h2><p class="pp-sub">An easy way to explore the neighborhood and meet a few people.</p>${btn('View event','event')}</section><p class="pp-sub">That’s the latest in this example neighborhood.</p>`;
        } else if(s.view==='ask') {
          html=`${back(s.askFromTask?'Private task':'Nearby',s.askFromTask?'task':'nav-nearby')}<h1>Ask your neighborhood.</h1><p class="pp-sub">Write the question you want people to see.</p>${s.askFromTask?'<div class="pp-note">Your private note, address, and attachments have not been copied.</div>':''}<label class="pp-label" for="pp-question">Your question</label><textarea id="pp-question" maxlength="1200" placeholder="What would you like advice about?">${esc(s.draft)}</textarea><div class="pp-panel"><div class="pp-eyebrow">Posting as</div><p>Alex · Neighborhood profile</p><div class="pp-eyebrow">Audience</div><p style="margin:0">Camas neighborhood members</p></div>${btn('Review question','review-question',true)}<div id="pp-error" role="alert"></div>`;
        } else if(s.view==='preview') {
          html=`${back('Edit question','ask')}<h1>Ready to share?</h1><p class="pp-sub">This is what neighborhood members will see.</p><section class="pp-panel"><div class="pp-author"><span class="pp-avatar">A</span><span>Alex<small>Camas · Neighborhood profile</small></span></div><p style="white-space:pre-wrap">${esc(s.draft)}</p><div class="pp-note">Audience: Camas neighborhood members</div></section><p class="pp-sub">Check your text for details you want to keep private. Your original task stays private.</p><div class="pp-actions">${btn('Post question','post',true)}${btn('Keep as draft','keep-draft')}</div>`;
        } else if(s.view==='thread') {
          const hasReply=s.posted&&!quiet();
          html=`${back('Nearby','nav-nearby')}<div class="pp-eyebrow">Camas neighborhood · Alex</div><h1>Your question.</h1><section class="pp-panel"><p style="white-space:pre-wrap">${esc(s.postText||s.draft)}</p></section><div class="pp-section-title">${hasReply?'1 reply':'Waiting for a reply'}</div>${hasReply?'<section class="pp-panel"><div class="pp-author"><span class="pp-avatar">JS</span><span>Jamie S.<small>Neighborhood member · Example reply</small></span></div><p>The repair café has a plumbing volunteer on Saturday. You could ask there about the washer.</p></section>':'<p class="pp-sub">Your question is posted. Responses depend on people choosing to help.</p>'}<div class="pp-actions">${btn(s.bookmark?'Reference saved':'Save reference privately','bookmark',true)}${s.postFromTask?btn('Back to private task','task'):''}</div><p class="pp-sub" style="margin-top:14px">A private bookmark does not change who can read the original conversation.</p>`;
        } else if(s.view==='following') {
          html=`<div class="pp-eyebrow">Beacons · Public profiles</div><h1>${s.followed?'People you follow.':'Find people worth following.'}</h1><p class="pp-sub">Get updates from people you choose. No home address needed.</p><section class="pp-panel">${author()}<p class="pp-sub">Maya hosts relaxed walks for people getting to know the area.</p>${s.followed?status('Following · Updates appear here'):''}${btn(s.followed?'Unfollow':'Follow Maya',s.followed?'unfollow':'follow',!s.followed)}<div class="pp-section-title">Latest public update · Example</div><h2>Welcome walk this Saturday</h2><div class="pp-event"><span class="pp-date">SEP<b>12</b></span><span>10:00–11:00 AM<small class="pp-sub" style="display:block">Camas · Pacific time</small></span></div>${btn('View event','event')}</section>${s.followed?btn('Notification preferences','preferences'):''}`;
        } else if(s.view==='event') {
          html=`${back(s.eventOrigin==='nearby'?'Nearby':s.eventOrigin==='home'?'Home':'Following & discovery','nav-'+s.eventOrigin)}${author()}<h1>Welcome walk.</h1><p>An easy neighborhood walk for anyone getting to know the area.</p><dl class="pp-detail-list"><div><dt>When</dt><dd>Sat, Sep 12 · 10:00–11:00 AM</dd></div><div><dt>Time zone</dt><dd>America/Los_Angeles (Pacific time)</dd></div><div><dt>Where</dt><dd>Community square · Example meeting place</dd></div><div><dt>Source</dt><dd>Maya’s public Beacon update</dd></div></dl>${s.eventSaved?status('Saved to your personal calendar'):''}<div class="pp-actions">${btn(s.eventSaved?'View saved event':'Save to my calendar',s.eventSaved?'saved-event':'review-event',true)}${!s.followed?btn('Follow Maya','follow'):''}</div><p class="pp-sub" style="margin-top:12px">Saving is private. It does not RSVP or notify Maya.</p>`;
        } else if(s.view==='review-event') {
          html=`${back('Event','event')}<h1>Save this plan.</h1><p class="pp-sub">Review the details before adding it.</p><dl class="pp-detail-list"><div><dt>Event</dt><dd>Welcome walk</dd></div><div><dt>When</dt><dd>Sep 12 · 10:00–11:00 AM<br>America/Los_Angeles</dd></div><div><dt>Destination</dt><dd>My personal calendar in Pantopus</dd></div><div><dt>Visibility</dt><dd>Only you</dd></div></dl><p class="pp-sub">This keeps a link to the public update. Changes to your saved plan require your review.</p>${btn('Save event','save-event',true)}`;
        } else if(s.view==='calendar') {
          html=`${back('Home','nav-home')}<div class="pp-eyebrow">${icon('lock-keyhole')}Personal calendar · Only you</div><h1>Your upcoming plans.</h1>${settings.situation!=='No home added'?row('Recycling pickup','Wed, Sep 9 · Your entered schedule','pickup'):''}${s.eventSaved?row('Welcome walk','Sat, Sep 12 · 10:00–11:00 AM','saved-event'):'<div class="pp-empty"><p class="pp-sub">Save a public event when you find something you want to remember.</p></div>'}${btn('Explore public events','nav-following')}`;
        } else if(s.view==='saved-event') {
          html=`${back('Calendar','calendar')}<div class="pp-eyebrow">${icon('lock-keyhole')}Personal calendar · Only you</div><h1>Welcome walk.</h1>${status('Saved in Pantopus')}<p>Sat, Sep 12 · 10:00–11:00 AM<br>America/Los_Angeles</p><p class="pp-sub">Source: Maya’s public Beacon update.<br>No RSVP sent.</p><div class="pp-actions">${btn('Open original event','event')}${btn('Remove saved event','remove-event')}</div>`;
        } else if(s.view==='pickup') {
          html=`${back('Home','nav-home')}<div class="pp-eyebrow">${icon('lock-keyhole')}Your entered schedule</div><h1>Recycling pickup.</h1><dl class="pp-detail-list"><div><dt>Next occurrence</dt><dd>Wednesday, September 9</dd></div><div><dt>Repeats</dt><dd>Every two weeks</dd></div><div><dt>Source</dt><dd>Entered by you · Not a confirmed city schedule</dd></div><div><dt>Reminder</dt><dd>Off</dd></div></dl><p class="pp-sub">A saved schedule is available in your calendar. This concept does not send reminders.</p>`;
        } else if(s.view==='inbox') {
          html=`<h1>Pick up where you left off.</h1><p class="pp-sub">Replies and updates with a clear next step.</p><div class="pp-tabs" aria-label="Inbox categories">${['Updates','Messages','Mail'].map(t=>`<button type="button" class="pp-tab" aria-pressed="${s.inbox===t}" data-action="inbox-${t}">${t}</button>`).join('')}</div>`;
          if(s.inbox==='Updates') html+=s.posted&&!quiet()?row('Jamie replied to your question',`${s.replyRead?'Read':'Unread'} · Camas neighborhood conversation`,'read-reply'):'<div class="pp-empty"><h2>You’re caught up.</h2><p class="pp-sub">Replies to your questions and updates you choose will appear here.</p></div>';
          else if(s.inbox==='Messages') html+='<div class="pp-empty"><h2>No messages yet.</h2><p class="pp-sub">Personal conversations and Beacon correspondence stay clearly labeled by identity.</p></div>';
          else html+='<div class="pp-empty"><h2>Digital mail.</h2><p class="pp-sub">Address-based mail has its own setup and eligibility. Saving a home or following someone does not activate mail service.</p></div>';
        } else if(s.view==='saved') {
          html=`${back('Home','nav-home')}<div class="pp-eyebrow">${icon('lock-keyhole')}Only you</div><h1>Saved references.</h1>${s.bookmark?row('Your neighborhood question','Private bookmark · Original audience still applies','thread'):'<p class="pp-sub">Save a useful conversation or public update to find it again.</p>'}`;
        } else if(s.view==='profile') {
          html=`${back('Back','return')}<h1>Your identities.</h1><p class="pp-sub">Choose what you share in each part of Pantopus.</p><section class="pp-panel"><h2>Private space</h2><p class="pp-sub">Your tasks, saved plans, and private notes.</p><h2>Neighborhood profile</h2><p class="pp-sub">Alex · Shown with your neighborhood posts.</p><h2>Public Beacon</h2><p class="pp-sub">Create a public profile only when you want to publish. Following does not create one.</p></section><p class="pp-sub">A public profile is not automatically linked to your home or neighborhood profile.</p>`;
        } else if(s.view==='preferences') {
          html=`${back('Following','nav-following')}<h1>Updates from Maya.</h1><p class="pp-sub">Following adds public updates to your Following screen.</p><section class="pp-panel"><h2>Push notifications</h2><p class="pp-sub">Off in this concept. The live app should ask permission only when you choose to enable them.</p></section>${btn('Unfollow Maya','unfollow')}`;
        }
        content.innerHTML=html;
        if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:16,height:16}});
      }
      const go=(view,active)=>{s.view=view;if(active)s.active=active;render();};
      root.addEventListener('input',e=>{if(e.target.id==='pp-question')s.draft=e.target.value;});
      root.addEventListener('click',e=>{
        const target=e.target.closest('button[data-action]');if(!target)return;
        const a=target.dataset.action;s.message='';
        if(a.startsWith('nav-')){const key=a.slice(4);go(key,key);return;}
        if(a.startsWith('inbox-')){s.inbox=a.slice(6);render();return;}
        if(a==='profile'){s.returnView=s.view;go('profile');return;}
        if(a==='return'){go(s.returnView);return;}
        if(a==='ask-task'||a==='ask-nearby'){s.askFromTask=a==='ask-task';go('ask',s.askFromTask?'home':'nearby');return;}
        if(a==='review-question'){
          s.draft=root.querySelector('#pp-question').value.trim();
          if(!s.draft){root.querySelector('#pp-error').innerHTML='<p class="pp-error">Write a question before reviewing it.</p>';return;}
          go('preview');return;
        }
        if(a==='post'){s.postText=s.draft;s.postFromTask=s.askFromTask;s.posted=true;s.replyRead=false;s.message=quiet()?'Question posted in this concept. No replies yet.':'Question posted in this concept. An example reply is available in Inbox.';go('nearby','nearby');return;}
        if(a==='keep-draft'){s.message='Draft kept in this concept. Nothing posted.';go(s.askFromTask?'task':'nearby',s.askFromTask?'home':'nearby');return;}
        if(a==='read-reply'){s.replyRead=true;go('thread','nearby');return;}
        if(a==='thread'){if(s.posted&&!quiet())s.replyRead=true;go('thread','nearby');return;}
        if(a==='toggle-done'){s.done=!s.done;s.message=s.done?'Private task completed. The neighborhood question is unchanged.':'Private task reopened.';render();return;}
        if(a==='bookmark'){s.bookmark=true;s.message='Private reference saved. The original conversation keeps its audience.';render();return;}
        if(a==='follow'){s.followed=true;s.message='Following Maya in this concept. No address or public profile required.';render();return;}
        if(a==='unfollow'){s.followed=false;s.message='Unfollowed in this concept. Your saved calendar entry remains.';go('following','following');return;}
        if(a==='save-event'){s.eventSaved=true;s.message='Saved privately in this concept. No RSVP sent.';go('saved-event','home');return;}
        if(a==='remove-event'){s.eventSaved=false;s.message='Saved event removed in this concept.';go('calendar','home');return;}
        if(a==='event'){if(s.view!=='review-event')s.eventOrigin=s.active;go('event');return;}
        const mapping={'task':['task','home'],'calendar':['calendar','home'],'saved':['saved','home'],'pickup':['pickup','home'],'review-event':['review-event',null],'saved-event':['saved-event','home'],'preferences':['preferences','following'],'ask':['ask',null]};
        if(mapping[a])go(...mapping[a]);
      });
      render();
      if(globalThis.Tweak){
        const tweaks=new Tweak({container:root,onChange:render});
        tweaks.addSelect(settings,'labels',{label:'Navigation labels',options:['Plain language','Branded']});
        tweaks.addSelect(settings,'situation',{label:'User situation',options:['Settling in','No home added','Quiet neighborhood']});
      }
    })();
  </script>
</div>
