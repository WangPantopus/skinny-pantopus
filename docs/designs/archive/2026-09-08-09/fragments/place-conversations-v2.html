<div id="pantopus-place-v2" aria-label="Pantopus place page design">
<style>
#pantopus-place-v2{--pp-paper:light-dark(#fcfbf7,#19251f);--pp-ink:light-dark(#203c31,#eff2e6);--pp-muted:light-dark(#52635a,#bdc9be);--pp-line:light-dark(#dce3d7,#3b4b40);--pp-soft:light-dark(#eef1e7,#26372d);--pp-green:light-dark(#244f3c,#b6d7aa);--pp-on-green:light-dark(#fbfbea,#173624);--pp-warm:light-dark(#f5edda,#3a3527);color-scheme:light dark;font:15px/1.55 ui-sans-serif,system-ui,sans-serif;color:var(--pp-ink);max-width:736px;margin:auto}
#pantopus-place-v2 *{box-sizing:border-box;min-width:0}
#pantopus-place-v2 .pp-caption{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:9px;font-size:12px;color:var(--pp-muted)}
#pantopus-place-v2 .pp-window{background:var(--pp-paper);border:1px solid var(--pp-line);border-radius:22px;overflow:clip}
#pantopus-place-v2 .pp-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 26px;border-bottom:1px solid var(--pp-line);font-size:13px}
#pantopus-place-v2 .pp-brand{display:flex;align-items:center;gap:6px;font-weight:500}
#pantopus-place-v2 .pp-header{padding:24px 28px 16px}
#pantopus-place-v2 h2{font:400 34px/1.12 Georgia,serif;letter-spacing:-.7px;margin:7px 0 12px}
#pantopus-place-v2 h3{font-size:17px;line-height:1.35;font-weight:500;margin:0 0 10px}
#pantopus-place-v2 p{margin:6px 0 12px}
#pantopus-place-v2 .pp-kind{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--pp-muted)}
#pantopus-place-v2 .pp-minor{font-size:12px;color:var(--pp-muted)}
#pantopus-place-v2 .pp-muted{color:var(--pp-muted)}
#pantopus-place-v2 .pp-between{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
#pantopus-place-v2 .pp-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#pantopus-place-v2 .pp-between .pp-actions{margin:0}
#pantopus-place-v2 button{font:inherit;font-weight:500;color:var(--pp-ink);background:var(--pp-paper);border:1px solid var(--pp-line);border-radius:10px;min-height:44px;padding:9px 13px;cursor:pointer;max-width:100%;white-space:normal}
#pantopus-place-v2 button:hover{background:var(--pp-soft)}
#pantopus-place-v2 .pp-primary{background:var(--pp-green);color:var(--pp-on-green);border-color:var(--pp-green)}
#pantopus-place-v2 .pp-primary:hover{background:var(--pp-green);filter:brightness(.97)}
#pantopus-place-v2 .pp-text{border:0;background:transparent;color:var(--pp-green);padding:7px 0;font-size:13px}
#pantopus-place-v2 .pp-glance{margin:0 28px 18px;padding:0 16px;background:var(--pp-soft);border-radius:15px}
#pantopus-place-v2 .pp-condition-summary{list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 0;min-height:60px;cursor:pointer}
#pantopus-place-v2 .pp-condition-summary::-webkit-details-marker{display:none}
#pantopus-place-v2 .pp-condition-summary strong{display:block;font-weight:500;font-size:17px;line-height:1.3;margin:3px 0}
#pantopus-place-v2 .pp-arrow{transition:transform .16s ease}
#pantopus-place-v2 details[open]>.pp-condition-summary .pp-arrow{transform:rotate(180deg)}
#pantopus-place-v2 .pp-condition-body{padding-bottom:15px;border-top:1px solid var(--pp-line)}
#pantopus-place-v2 .pp-observation{padding:12px 0;border-bottom:1px solid var(--pp-line)}
#pantopus-place-v2 .pp-observation strong{font-weight:500;font-size:14px;display:block}
#pantopus-place-v2 .pp-observation p{font-size:13px;color:var(--pp-muted);margin:4px 0 0}
#pantopus-place-v2 .pp-offer-shortcut{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-top:1px solid var(--pp-line)}
#pantopus-place-v2 .pp-offer-shortcut button{flex:1;background:transparent;border:0;text-align:left;padding:0;font-size:14px}
#pantopus-place-v2 .pp-offer-shortcut small{display:block;font-size:12px;color:var(--pp-muted);font-weight:400}
#pantopus-place-v2 .pp-tabs{display:flex;gap:3px;flex-wrap:wrap;padding:0 24px;border-bottom:1px solid var(--pp-line)}
#pantopus-place-v2 .pp-tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--pp-muted);padding:12px}
#pantopus-place-v2 .pp-tabs button[aria-pressed=true]{color:var(--pp-green);background:var(--pp-soft);box-shadow:inset 0 -2px var(--pp-green)}
#pantopus-place-v2 .pp-panel{padding:22px 28px 26px}
#pantopus-place-v2 .pp-thread{padding:18px 0;border-bottom:1px solid var(--pp-line)}
#pantopus-place-v2 .pp-author{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--pp-muted)}
#pantopus-place-v2 .pp-avatar{width:28px;height:28px;flex:none;border-radius:50%;background:var(--pp-soft);display:grid;place-items:center;color:var(--pp-ink)}
#pantopus-place-v2 .pp-thread-title{display:block;border:0;background:transparent;border-radius:5px;text-align:left;padding:8px 0 3px;width:100%;font-size:17px;line-height:1.4}
#pantopus-place-v2 .pp-thread-title:hover{background:transparent;text-decoration:underline;text-underline-offset:4px}
#pantopus-place-v2 .pp-thread p{font-size:14px;color:var(--pp-muted);margin:4px 0 8px}
#pantopus-place-v2 .pp-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--pp-soft);border-top:1px solid var(--pp-line);padding:16px 28px}
#pantopus-place-v2 .pp-quiet,#pantopus-place-v2 .pp-event{background:var(--pp-soft);border-radius:15px;padding:20px}
#pantopus-place-v2 .pp-quiet h3,#pantopus-place-v2 .pp-event h3{font:400 25px/1.2 Georgia,serif}
#pantopus-place-v2 .pp-event{display:flex;align-items:flex-start;gap:16px}
#pantopus-place-v2 .pp-date{min-width:45px;text-align:center;font-size:12px;color:var(--pp-muted)}
#pantopus-place-v2 .pp-date span{display:block;font:400 32px/1.1 Georgia,serif;color:var(--pp-ink)}
#pantopus-place-v2 .pp-banner{background:var(--pp-warm);padding:13px 16px;border-radius:12px;margin-bottom:18px;font-size:14px}
#pantopus-place-v2 .pp-banner strong{display:block;font-weight:500}
#pantopus-place-v2 .pp-facts{margin:0}
#pantopus-place-v2 .pp-facts>div{padding:13px 0;border-bottom:1px solid var(--pp-line)}
#pantopus-place-v2 .pp-facts dt{font-size:12px;color:var(--pp-muted)}
#pantopus-place-v2 .pp-facts dd{margin:4px 0 0}
#pantopus-place-v2 .pp-rule{border-bottom:1px solid var(--pp-line);padding:3px 0}
#pantopus-place-v2 .pp-rule summary{cursor:pointer;padding:13px 0;min-height:48px;font-size:14px}
#pantopus-place-v2 .pp-rule p{font-size:13px;color:var(--pp-muted)}
#pantopus-place-v2 .pp-offer-hero{background:var(--pp-warm);border-radius:16px;padding:23px;margin:10px 0 18px}
#pantopus-place-v2 .pp-offer-hero h3{font:400 29px/1.15 Georgia,serif;margin:9px 0}
#pantopus-place-v2 .pp-reply{background:var(--pp-soft);border-left:2px solid var(--pp-line);padding:16px;margin:16px 0}
#pantopus-place-v2 textarea,#pantopus-place-v2 select{display:block;width:100%;background:var(--pp-paper);color:var(--pp-ink);border:1px solid var(--pp-line);border-radius:10px;padding:12px;font:inherit;font-size:16px;margin:8px 0}
#pantopus-place-v2 textarea{resize:vertical;min-height:88px}
#pantopus-place-v2 .pp-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#pantopus-place-v2 label{display:block;font-size:14px}
#pantopus-place-v2 .pp-check{display:flex;align-items:center;gap:9px;min-height:44px}
#pantopus-place-v2 .pp-status{font-size:12px;color:var(--pp-muted);margin:8px 0;min-height:18px;overflow-wrap:anywhere;white-space:pre-wrap}
#pantopus-place-v2 .pp-quote{font:400 26px/1.35 Georgia,serif;overflow-wrap:anywhere}
@media(max-width:460px){#pantopus-place-v2 .pp-header,#pantopus-place-v2 .pp-panel{padding:20px}#pantopus-place-v2 .pp-top{padding:13px 20px}#pantopus-place-v2 h2{font-size:29px}#pantopus-place-v2 .pp-glance{margin:0 20px 16px;padding:0 13px}#pantopus-place-v2 .pp-tabs{padding:0 10px}#pantopus-place-v2 .pp-tabs button{font-size:14px;padding:11px 9px}#pantopus-place-v2 .pp-footer{padding:16px 20px}#pantopus-place-v2 .pp-form-grid{grid-template-columns:1fr}#pantopus-place-v2 .pp-condition-summary strong{font-size:16px}#pantopus-place-v2 .pp-event{padding:15px;gap:11px}}
@media(prefers-reduced-motion:reduce){#pantopus-place-v2 .pp-arrow{transition:none}}
</style>
<div class="pp-caption"><span>Fictional place-page concept · nothing is published</span><span id="pp-preview-date">Preview date: Sep 9, 2026</span></div>
<section class="pp-window" aria-label="Cedar House Cafe place page">
<div class="pp-top"><span class="pp-brand"><i data-lucide="asterisk" aria-hidden="true"></i> Pantopus</span><span>Nearby / Places</span></div>
<header class="pp-header"><div class="pp-kind">Cafe · public place</div><h2>Cedar House Cafe</h2><div class="pp-between"><div class="pp-muted">18 Market Street<br><span class="pp-minor">Illustrative location</span></div><div class="pp-actions"><button type="button" class="pp-primary" id="pp-follow" aria-pressed="false">Follow place</button><button type="button" id="pp-save" aria-pressed="false">Save privately</button></div></div><div class="pp-status" id="pp-follow-status" aria-live="polite">Your follows stay private. Phone alerts are off.</div></header>
<div id="pp-glance" class="pp-glance"></div>
<nav class="pp-tabs" aria-label="Place views"><button type="button" data-tab="conversations" aria-pressed="true">Conversations</button><button type="button" data-tab="upcoming" aria-pressed="false">Upcoming</button><button type="button" data-tab="visit" aria-pressed="false">Visit info</button></nav>
<div id="pp-panel" class="pp-panel"></div>
<div class="pp-footer"><span class="pp-minor">A moment, a question, a reason to connect.</span><button type="button" data-action="compose">Start a conversation</button></div>
</section>
<script>
(()=>{
const root=document.getElementById('pantopus-place-v2'),panel=root.querySelector('#pp-panel');
const design={volume:'Everyday',conditions:'One report',offers:'Current'};
const state={tab:'conversations',detail:null,back:'conversations',following:false,saved:false,offerSaved:false,planSaved:false,thread:0,recent:false,draft:'',reply:'',correction:'',observation:''};
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const threads=[
{name:'Maya',letter:'M',kind:'Moment',time:'Yesterday',title:'Anyone else sketch the places they spend time in?',body:'I started drawing this corner while waiting for the rain to stop. I would love to see what you notice here.',count:'6 replies',responder:'Elena',response:'The window seats are my favorite. I have a drawing from last winter — I will find it.'},
{name:'Dev',letter:'D',kind:'Question',time:'2 days ago',title:'Which entrance has a step-free route?',body:'Planning a visit with my dad. Is the Market Street entrance the best approach?',count:'3 replies',responder:'Jo',response:'I used the side entrance last week. It is worth checking with the cafe before your visit.'},
{name:'Cedar House',letter:'C',kind:'Cafe team',time:'Sep 8',title:'An evening of sketches, September 19',body:'Bring a notebook and join our public drawing evening. Details and questions are in this conversation.',count:'4 replies',responder:'Maya',response:'Is it okay to come if I have never tried this before?'}];
const fact=(name,value)=>'<div><dt>'+name+'</dt><dd>'+value+'</dd></div>';
const report=(name,value)=>'<div class="pp-observation"><strong>'+name+'</strong><p>'+value+'</p></div>';
const back=()=>'<button type="button" class="pp-text" data-action="back">← Back to '+({conversations:'conversations',upcoming:'upcoming',visit:'visit info'}[state.back])+'</button>';
function glance(){
root.querySelector("#pp-preview-date").textContent="Preview date: "+(design.offers==="Expired"?"Sep 14, 2026":"Sep 9, 2026");
const examples={
'One report':['15–25 min quoted table wait','1 visitor report · observed 8 min ago',report('A visitor’s observation','A host quoted a 15–25 minute table wait for 2 people. Observed at 3:52 PM; submitted at 3:54 PM · America/Chicago, on the preview date.')+report('Busyness','No recent observation. A table wait does not establish how busy the whole cafe is.')],
'Mixed reports':['Recent wait reports differ','2 reports · different party sizes',report('Under 10 min · party of 2','Visitor-reported quoted table wait, observed 5 minutes ago.')+report('25–40 min · party of 6','Visitor-reported quoted table wait, observed 9 minutes ago.')+report('Different experiences can both be real','Party size and timing differ. These reports are not averaged into one estimate.')],
'No recent reports':['No recent conditions reported','Current wait and busyness are unknown',report('No current estimate','A lack of reports does not mean the place is quiet. Check with the cafe before traveling.')],
'Expired':['No current wait estimate','The previous observation is out of date',report('Earlier report · expired','One visitor reported a 15–25 minute quoted table wait 2 hours ago. It is history, not a current estimate.')],
'Venue update':['Pickup is temporarily paused','Cafe team update · 12 min ago',report('From Cedar House Cafe','The cafe team says pickup orders are paused while equipment is checked. Dine-in status was not supplied.')+report('Source matters','This is the venue’s statement. No visitor observation confirms the equipment status.')]};
const value=examples[design.conditions],wasOpen=root.querySelector('#pp-conditions')?.open||false;
root.querySelector('#pp-glance').innerHTML='<details id="pp-conditions"'+(wasOpen?' open':'')+'><summary class="pp-condition-summary"><div><span class="pp-kind">Recent conditions</span><strong>'+value[0]+'</strong><span class="pp-minor">'+value[1]+'</span></div><span class="pp-arrow" aria-hidden="true">⌄</span></summary><div class="pp-condition-body">'+value[2]+'<div class="pp-actions"><button type="button" data-action="observation">Add an observation</button><button type="button" class="pp-text" data-action="flag">Flag a misleading report</button></div><p class="pp-minor">Illustrative reports. No live conditions or visitor location verified.</p></div></details>'+(design.offers==='Current'?'<div class="pp-offer-shortcut"><button type="button" data-action="offer">A cookie on the house with a drink<small>From the cafe · Sep 9–13 · see terms</small></button><span aria-hidden="true">→</span></div>':'');
}
const event=()=>'<div class="pp-event"><div class="pp-date">SEP<span>19</span></div><div><h3>An evening of sketches</h3><p>6:30 PM · America/Chicago<br>From the cafe’s public calendar</p><button type="button" class="pp-text" data-action="event">Details & private plan →</button></div></div>';
function conversations(){if(design.volume==='Quiet')return '<div class="pp-quiet"><h3>A place for the first conversation.</h3><p>No public conversations here yet.</p><span class="pp-minor">Explore an upcoming event or keep this place privately.</span></div><h3 style="margin-top:23px">From the public calendar</h3>'+event();
return (design.volume==='Surge'?'<div class="pp-banner"><strong>Drawing evening · related conversations</strong>Separate voices and replies, easier to explore together.</div>':'')+'<div class="pp-between"><h3>Conversations about this place</h3><button type="button" class="pp-text" data-action="sort">'+(state.recent?'Recent ↓':'Selected · see recent')+'</button></div>'+(state.recent?[0,1,2]:[0,2,1]).map(i=>{const t=threads[i];return '<article class="pp-thread"><div class="pp-author"><span class="pp-avatar">'+t.letter+'</span><span>'+t.name+' · '+t.kind+' · '+t.time+'</span></div><button type="button" class="pp-thread-title" data-thread="'+i+'">'+t.title+'</button><p>'+t.body+'</p><div class="pp-minor">'+t.count+' · Public · About this place</div></article>';}).join('');}
function visit(){return '<h3>A little easier to plan your visit.</h3><dl class="pp-facts">'+fact('Where','18 Market Street · Cedar House Cafe')+fact('Accessibility','Step-free entrance via Garden Lane.<details class="pp-rule"><summary>Source & details</summary><p>Venue access guide · checked Sep 8, 2026. The route is described by the cafe; an on-site assessment is not supplied. Fictional example.</p></details>')+fact('Offers & benefits','<button type="button" class="pp-text" data-action="offer">'+(design.offers==='Current'?'Cookie with a drink · view offer →':design.offers==='Expired'?'No current offer · view previous terms →':'No current offers · details →')+'</button>')+'</dl><h3 style="margin-top:24px">Rules & visiting</h3><details class="pp-rule"><summary>Groups of 6 or more need a reservation</summary><p>Venue policy · for dine-in groups. Cafe booking page, checked Sep 8, 2026. Fictional example; not a reservation or legal requirement.</p></details><details class="pp-rule"><summary>Cards and cash accepted</summary><p>Venue information · cafe website, checked Sep 8, 2026. Fictional source detail.</p></details><details class="pp-rule"><summary>Visitor tip: ask about the window tables</summary><p>A visitor suggestion posted Sep 7, 2026. Seating is not guaranteed; this is not a venue rule.</p></details><div class="pp-actions"><button type="button" data-action="correction">Suggest a correction</button></div><p class="pp-minor">Source labels distinguish venue policies from visitor experiences.</p>';}
function offer(){if(design.offers==='None')return back()+'<h3>No current offers listed</h3><p class="pp-muted">Upcoming events and visiting information are still available.</p><p class="pp-minor">No discount or benefit is inferred from missing information.</p>';
const expired=design.offers==='Expired';return back()+'<div class="pp-offer-hero"><div class="pp-kind">'+(expired?'Expired offer':'From Cedar House Cafe')+'</div><h3>A little treat with your drink.</h3><p>One classic cookie with a purchased regular hot drink.</p><span class="pp-minor">'+(expired?'Ended Sep 13, 2026':'Sep 9–13, 2026 · Market Street branch')+'</span></div><dl class="pp-facts">'+fact('What you need to buy','One regular hot drink at the counter.')+fact('Limits & exclusions','One cookie per person per day; while supplies last. Delivery orders and specialty cookies excluded.')+fact('When',('Sep 9–13')+', 2026 · during advertised opening hours · America/Chicago.')+fact('How to use it',expired?'This previous offer is no longer presented as redeemable.':'Ask at the counter before ordering. No code or reservation; stock has not been checked.')+fact('Source','Cafe offer page · terms checked '+('Sep 9')+', 2026. Fictional example.')+'</dl>'+(expired?'<p class="pp-minor">'+(state.offerSaved?'Your saved copy remains history, not an active benefit.':'Previous terms are shown for context.')+'</p>':'<div class="pp-actions"><button type="button" class="pp-primary" data-action="save-offer" aria-pressed="'+state.offerSaved+'">'+(state.offerSaved?'Saved · Only you':'Save offer privately')+'</button></div><p class="pp-minor">Saving keeps the terms. It does not reserve stock or confirm redemption.</p>')+'<div id="pp-offer-status" class="pp-status" aria-live="polite"></div>';}
function observation(){return back()+'<div class="pp-kind">Recent conditions · your observation</div><h3>What did you notice?</h3><p class="pp-muted">Describe your own experience. Different queues and party sizes can have different waits.</p><form id="pp-observation-form"><label for="pp-observation-kind">What are you reporting?</label><select id="pp-observation-kind" required><option value="quoted">A quoted table wait</option><option value="elapsed">My table wait so far</option><option value="completed">My completed table wait</option><option value="pickup">A quoted pickup wait</option><option value="busy">How busy it looked</option></select><div class="pp-form-grid"><label for="pp-observation-value">Your observation<select id="pp-observation-value" required><option value="">Choose a range</option><option>Under 10 minutes</option><option>10–20 minutes</option><option>20–40 minutes</option><option>Over 40 minutes</option></select></label><label for="pp-observation-time">When did you observe it?<select id="pp-observation-time" required><option value="">Choose a time</option><option>Just now</option><option>About 5 minutes ago</option><option>About 15 minutes ago</option><option>About 30 minutes ago</option></select></label></div><label for="pp-party">Party size, if relevant<select id="pp-party"><option>Not supplied</option><option>1–2 people</option><option>3–4 people</option><option>5–6 people</option><option>More than 6 people</option></select></label><p class="pp-minor">Public observation · shown as “A visitor.” Your account is not listed publicly. This preview sends nothing.</p><button type="submit" class="pp-primary">Preview my report</button></form><div id="pp-observation-preview" class="pp-status" aria-live="polite">'+escape(state.observation)+'</div>';}
function render(){root.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===state.tab)));
if(state.detail==='offer'){panel.innerHTML=offer();return;}
if(state.detail==='observation'){panel.innerHTML=observation();return;}
if(state.detail==='flag'||state.detail==='correction'){panel.innerHTML=back()+'<h3>'+(state.detail==='flag'?'What seems misleading?':'What needs a correction?')+'</h3><p class="pp-muted">'+(state.detail==='flag'?'Different experiences alone do not prove a report false. Describe the issue for review.':'Identify the detail and, if possible, a source for the correction.')+'</p><form id="pp-correction-form"><label for="pp-correction">Your note<textarea id="pp-correction" maxlength="500" required>'+escape(state.correction)+'</textarea></label><button type="submit" class="pp-primary">Preview note</button></form><div id="pp-correction-preview" class="pp-status" aria-live="polite"></div>';return;}
if(state.detail==='compose'){panel.innerHTML=back()+'<h3>Start with something you want to share.</h3><label for="pp-draft">Your post<textarea id="pp-draft" maxlength="500" placeholder="A moment, a question, or a plan…">'+escape(state.draft)+'</textarea></label><p class="pp-minor">Posting as you · Public<br>About Cedar House Cafe · 18 Market Street</p><label class="pp-check"><input type="checkbox" id="pp-discover"> Show in this place’s public conversations</label><div class="pp-actions"><button type="button" class="pp-primary" data-action="preview-post">Preview post</button></div><div id="pp-post-preview" class="pp-status" aria-live="polite"></div>';return;}
if(state.detail==='event'){panel.innerHTML=back()+'<div class="pp-kind">Public calendar · example source</div><h3>An evening of sketches</h3><p>September 19, 2026 · 6:30 PM<br>America/Chicago · Cedar House Cafe</p><p>Bring a notebook for an informal drawing evening.</p><details class="pp-rule"><summary>Plan details & source</summary><p>From the cafe calendar. End time, booking conditions, and availability have not been supplied. All details are fictional.</p></details><div class="pp-actions"><button type="button" class="pp-primary" data-action="save-plan">'+(state.planSaved?'Plan saved · Only you':'Save these details privately')+'</button>'+(design.volume!=='Quiet'?'<button type="button" data-thread="2">Read the conversation</button>':'')+'</div><div id="pp-plan-status" class="pp-status" aria-live="polite">Review the date, time, timezone, and destination shown. No RSVP or attendance is shared.</div>';return;}
if(state.detail==='thread'){const t=threads[state.thread];panel.innerHTML=back()+'<div class="pp-author">'+t.name+' · '+t.kind+' · '+t.time+' · Public</div><p class="pp-quote">'+t.title+'</p><p>'+t.body+'</p><div class="pp-reply"><div class="pp-author">'+t.responder+' · Reply</div><p>'+t.response+'</p></div><label for="pp-reply">Join the conversation<textarea id="pp-reply" maxlength="500" placeholder="Write a reply…">'+escape(state.reply)+'</textarea></label><button type="button" class="pp-primary" data-action="preview-reply">Preview reply</button><div id="pp-reply-preview" class="pp-status" aria-live="polite"></div><p class="pp-minor">Original post and replies · Nothing is sent from this concept.</p>';return;}
panel.innerHTML=state.tab==='conversations'?conversations():state.tab==='upcoming'?'<h3>Upcoming at this place</h3>'+event():visit();}
function open(detail){state.back=state.tab;state.detail=detail;const conditions=root.querySelector('#pp-conditions');if(conditions)conditions.open=false;render();panel.querySelector('button')?.focus();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.action;
if(b.dataset.tab){state.tab=b.dataset.tab;state.detail=null;render();}
if(b.id==='pp-follow'){state.following=!state.following;b.setAttribute('aria-pressed',String(state.following));b.textContent=state.following?'Following place':'Follow place';root.querySelector('#pp-follow-status').textContent=state.following?'Following in this concept only. Private · phone alerts off.':'Your follows stay private. Phone alerts are off.';}
if(b.id==='pp-save'){state.saved=!state.saved;b.setAttribute('aria-pressed',String(state.saved));b.textContent=state.saved?'Saved · Only you':'Save privately';root.querySelector('#pp-follow-status').textContent=state.saved?'Saved in this concept session only. No post or reservation.':'Private save removed from this concept.';}
if(b.dataset.thread!==undefined){state.thread=Number(b.dataset.thread);open('thread');}
if(action==='back'){state.tab=state.back;state.detail=null;render();root.querySelector('[data-tab="'+state.tab+'"]').focus({preventScroll:true});}
if(['offer','event','flag','correction','observation','compose'].includes(action))open(action);
if(action==='sort'){state.recent=!state.recent;render();panel.querySelector('[data-action="sort"]').focus({preventScroll:true});}
if(action==='save-offer'){state.offerSaved=!state.offerSaved;b.setAttribute('aria-pressed',String(state.offerSaved));b.textContent=state.offerSaved?'Saved · Only you':'Save offer privately';root.querySelector('#pp-offer-status').textContent=state.offerSaved?'Terms kept in this preview session. No redemption or reservation.':'Offer removed from preview saves.';}
if(action==='save-plan'){state.planSaved=!state.planSaved;b.textContent=state.planSaved?'Plan saved · Only you':'Save these details privately';root.querySelector('#pp-plan-status').textContent=state.planSaved?'Saved in this preview session only. No device calendar, RSVP, or reminder changed.':'Plan removed from preview saves.';}
if(action==='preview-reply')root.querySelector('#pp-reply-preview').textContent=state.reply.trim()?'Your reply preview: '+state.reply.trim()+' — Nothing has been published.':'Write a reply to preview it.';
if(action==='preview-post')root.querySelector('#pp-post-preview').textContent=state.draft.trim()?'Preview: '+state.draft.trim()+' — Public'+(root.querySelector('#pp-discover').checked?' · Shown in this place’s conversations.':' · Excluded from place discovery.')+' Nothing has been published.':'Write something to preview it.';
});
root.addEventListener('input',e=>{if(e.target.id==='pp-draft')state.draft=e.target.value;if(e.target.id==='pp-reply')state.reply=e.target.value;if(e.target.id==='pp-correction')state.correction=e.target.value;});
root.addEventListener('change',e=>{if(e.target.id==='pp-observation-kind'){const busy=e.target.value==='busy';root.querySelector('#pp-observation-value').innerHTML='<option value="">'+(busy?'Choose what you observed':'Choose a range')+'</option>'+(busy?['Quiet','Moderately busy','Very busy']:['Under 10 minutes','10–20 minutes','20–40 minutes','Over 40 minutes']).map(v=>'<option>'+v+'</option>').join('');root.querySelector('#pp-party').disabled=busy||e.target.value==='pickup';}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='pp-observation-form'){const kind=root.querySelector('#pp-observation-kind'),value=root.querySelector('#pp-observation-value').value,time=root.querySelector('#pp-observation-time').value,party=root.querySelector('#pp-party');state.observation='Preview: '+kind.options[kind.selectedIndex].text+' · '+value+' · '+time+(!party.disabled&&party.value!=='Not supplied'?' · '+party.value:'')+'. No report was sent; the displayed status has not changed.';root.querySelector('#pp-observation-preview').textContent=state.observation;}if(e.target.id==='pp-correction-form')root.querySelector('#pp-correction-preview').textContent='Preview: '+state.correction.trim()+'. No correction or report was sent.';});
glance();render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{state.detail=null;glance();render();}});tweak.addSelect(design,'volume',{label:'Conversation volume',options:['Quiet','Everyday','Surge']});tweak.addSelect(design,'conditions',{label:'Recent conditions',options:['One report','Mixed reports','No recent reports','Expired','Venue update']});tweak.addSelect(design,'offers',{label:'Offer availability',options:['Current','Expired','None']});}
})();
</script>
</div>
