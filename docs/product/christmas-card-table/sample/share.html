<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=La+Belle+Aurore&family=Nothing+You+Could+Do&display=swap">
<style>
:root{--serif:"New York",ui-serif,Georgia,"Times New Roman",serif;--hand:"Nothing You Could Do",cursive;--pen:"La Belle Aurore",cursive;--ink-pen:#1b2a5c;--ink-caption:#1d2b63;--ink-year:#2b2622}
html,body{margin:0;background:#111}
#art{position:relative;overflow:hidden;width:540px;height:960px}
#table{position:absolute;inset:-10px;background-size:cover;background-position:50% 50%}
#light{position:absolute;inset:-60px;background:url(a/light.webp);background-size:100% 100%;mix-blend-mode:soft-light;opacity:.95}
#vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 46% 40%,rgba(0,0,0,0) 44%,rgba(6,3,4,.48) 100%)}
#grain{position:absolute;inset:0;background:url(a/grain.png);background-size:128px;opacity:.34;mix-blend-mode:overlay}
.obj{position:absolute;transform-origin:50% 50%}
.obj>img{display:block;width:100%;height:100%}
.cardBox{position:absolute;transform-origin:50% 50%;width:calc(var(--u)*100);height:calc(var(--u)*120);border-radius:calc(var(--u)*.7);box-shadow:calc(var(--u)*.6) calc(var(--u)*1.1) calc(var(--u)*2) rgba(0,0,0,.42),calc(var(--u)*1.6) calc(var(--u)*3.2) calc(var(--u)*9) rgba(0,0,0,.45)}
.face{position:absolute;inset:0;overflow:hidden;border-radius:inherit;background:#f9f1e3;isolation:isolate}
.photo{position:absolute;left:calc(var(--u)*1.7);top:calc(var(--u)*1.7);width:calc(var(--u)*96.6);height:calc(var(--u)*103);object-fit:cover;box-shadow:0 0 0 .5px rgba(70,50,20,.25);filter:contrast(1.03) saturate(1.04)}
.caption{position:absolute;left:calc(var(--u)*4.2);top:calc(var(--u)*107.4);font-family:var(--hand);color:var(--ink-caption);white-space:nowrap;line-height:1}
.year{position:absolute;left:calc(var(--u)*4.2);top:calc(var(--u)*114.2);font:calc(var(--u)*2.2)/1 var(--serif);letter-spacing:.42em;color:var(--ink-year);white-space:nowrap}
.pm{position:absolute;left:calc(var(--u)*77.5);top:calc(var(--u)*106.2);width:calc(var(--u)*20);height:calc(var(--u)*12);transform:rotate(-3deg)}
.pm svg{width:100%;height:100%;display:block}
.grainMul{position:absolute;inset:0;background:url(a/paper.webp);background-size:calc(var(--u)*60);mix-blend-mode:multiply;opacity:.7}
.edges{position:absolute;inset:0;box-shadow:inset 0 0 calc(var(--u)*2.6) rgba(110,80,30,.2);border-radius:inherit}
.rules{position:absolute;left:calc(var(--u)*8);right:calc(var(--u)*8);top:calc(var(--u)*9);height:calc(var(--u)*83.6);background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) calc(var(--u)*7.6 - 1px),rgba(74,84,118,.2) calc(var(--u)*7.6 - 1px),rgba(74,84,118,.2) calc(var(--u)*7.6))}
.note{position:absolute;left:calc(var(--u)*8);right:calc(var(--u)*7);top:calc(var(--u)*9);font-family:var(--pen);font-size:calc(var(--u)*6);line-height:calc(var(--u)*7.6);color:var(--ink-pen);mix-blend-mode:multiply}
.note .w{display:inline-block;white-space:pre}
.from{position:absolute;left:calc(var(--u)*8);right:calc(var(--u)*8);top:calc(var(--u)*97);display:flex;align-items:baseline;gap:calc(var(--u)*2)}
.from b{font:calc(var(--u)*2.3)/1 var(--serif);letter-spacing:.24em;color:#6a5f52;font-weight:400}
.from span{font-family:var(--pen);font-size:calc(var(--u)*6.4);line-height:1;color:var(--ink-pen);mix-blend-mode:multiply}
.foot{position:absolute;left:0;right:0;bottom:calc(var(--u)*3.2);text-align:center;font:calc(var(--u)*1.9)/1 var(--serif);letter-spacing:.3em;color:#8a7f70}
/* The small paper slip: the name in the mail's own world. */
.slip{position:absolute;transform-origin:50% 50%;background:#f4ead6 url(a/paper.webp);background-size:220px;background-blend-mode:multiply;box-shadow:1px 2px 5px rgba(0,0,0,.45);color:#3a2f26;display:flex;flex-direction:column;justify-content:center;border-radius:1.5px}
.slip b{font:600 var(--s1)/1.1 var(--serif);letter-spacing:.24em;white-space:nowrap}
.slip span{font:var(--s2)/1.25 var(--serif);letter-spacing:.03em;white-space:nowrap;color:#5b4d3f}
.mark{position:absolute;transform-origin:50% 50%;border:3px double #ecd7a4;color:#ecd7a4;font:700 var(--mf)/1.2 var(--serif);letter-spacing:.11em;text-align:center;text-transform:uppercase;padding:.55em .9em;border-radius:6px;-webkit-mask-image:url(a/paper.webp);mask-image:url(a/paper.webp)}
.side{position:absolute;color:#f6ecd9}
</style></head><body><div id="art"><div id="table"></div></div>
<script>
const P = new URLSearchParams(location.hash.slice(1));
const n = +(P.get('n') || 8), v = P.get('v') || 'card', f = P.get('f') || 'story';
const C = {
  8: { caption: 'Come finish our snowman.', paper: '#f9f1e3', note: "Dear Maya,\nFound this and thought of the winter we built the one with Dad's old hat. It still makes me laugh. Come home early this year, the kids ask about you every day.\nLove you lots," },
  1: { caption: 'Home for Christmas.', paper: '#f7eee0', note: "Dear Maya,\nThe porch lights are up and your room is ready. Mom already hid the good cookies from me. Drive safe, and call when you pass the bridge.\nSee you soon," },
  24:{ caption: 'Another Christmas. Still you.', paper: '#f9f1df', note: "My Maya,\nForty-one Christmases and you still steal the blanket. I wouldn't change a thing. Save me the seat by the tree.\nYours always," },
}[n];
const num = String(n).padStart(2, '0');
const art = document.getElementById('art');
const SIZE = { story: [540, 960], post: [540, 675], link: [600, 315] }[f];
art.style.width = SIZE[0] + 'px'; art.style.height = SIZE[1] + 'px';
document.getElementById('table').style.backgroundImage = `url(a/table-${num}.jpg)`;
function seeded(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function noteHTML(text) {
  const rnd = seeded(n * 7 + 3);
  return text.split('\n').map((line) => `<div>${line.split(/( )/).map((w) => w === ' ' ? ' ' : `<span class="w" style="transform:translateY(${((rnd() - .5) * .34).toFixed(3)}em) rotate(${((rnd() - .5) * 1.5).toFixed(2)}deg);opacity:${(.86 + rnd() * .14).toFixed(2)}">${w}</span>`).join('')}</div>`).join('');
}
const PM = `<svg viewBox="0 0 100 60" fill="none" stroke="#b2413a" stroke-opacity=".86"><circle cx="36" cy="30" r="22" stroke-width="1.6"/><circle cx="36" cy="30" r="18.5" stroke-width=".8"/><path stroke-width="1.6" d="M58 21q6-8 12 0t12 0t12 0M58 30q6-8 12 0t12 0t12 0M58 39q6-8 12 0t12 0t12 0"/><text x="36" y="28" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="7.6" fill="#b2413a" stroke="none">NOV 6</text><text x="36" y="40" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="8.5" fill="#b2413a" stroke="none">2026</text></svg>`;
function cardFront(w, x, y, rot) {
  const size = Math.min(4.8, 70 / Math.max(1, C.caption.length * .53));
  return `<div class="cardBox" style="--u:${w / 100}px;left:${x}px;top:${y}px;transform:rotate(${rot}deg)"><div class="face" style="background:${C.paper}"><img class="photo" src="a/card-${num}.jpg"><div class="caption" style="font-size:calc(var(--u)*${size})">${C.caption}</div><div class="year">CHRISTMAS, 2026</div><div class="pm">${PM}</div><div class="grainMul"></div><div class="edges"></div></div></div>`;
}
function cardBack(w, x, y, rot) {
  return `<div class="cardBox" style="--u:${w / 100}px;left:${x}px;top:${y}px;transform:rotate(${rot}deg)"><div class="face" style="background:${C.paper}"><div class="rules"></div><div class="note">${noteHTML(C.note)}</div><div class="from"><b>FROM</b><span>Daniel</span></div><div class="foot">PANTOPUS POST · CHRISTMAS 2026</div><div class="grainMul"></div><div class="edges"></div></div></div>`;
}
/* The open envelope lying behind: inside lining, flap up, pocket. */
function openEnvelope(w, x, top, rot) {
  const h = w * 1392 / 1200, fd = w * 512 / 1200;
  return `<div class="obj" style="left:${x}px;top:${top}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg);filter:drop-shadow(2px 5px 7px rgba(0,0,0,.5))">
    <img src="a/env-flap-in.webp" style="position:absolute;left:0;top:${-fd}px;width:100%;height:${fd}px"><img src="a/env-inside.webp" style="position:absolute;inset:0"><img src="a/env-pocket-shadow.webp" style="position:absolute;inset:0"><img src="a/env-pocket.webp" style="position:absolute;inset:0"></div>`;
}
function shutEnvelope(w, x, top, rot, sealW) {
  const h = w * 1392 / 1200, fd = w * 512 / 1200;
  return `<div class="obj" style="left:${x}px;top:${top}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg);filter:drop-shadow(3px 8px 11px rgba(0,0,0,.55))">
    <img src="a/env-pocket.webp" style="position:absolute;inset:0"><img src="a/env-flap-shadow.webp" style="position:absolute;inset:0"><img src="a/env-flap-out.webp" style="position:absolute;left:0;top:0;width:100%;height:${fd}px"><img src="a/wax-gold.webp" style="position:absolute;left:${(w - sealW) / 2}px;top:${fd * .96 - sealW * .5}px;width:${sealW}px;height:auto"></div>`;
}
function slip(x, y, rot, w, h, s1, s2) {
  return `<div class="slip" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg);padding-left:${h * .36}px;--s1:${s1}px;--s2:${s2}px"><b>PANTOPUS POST</b><span>Send one at pantopus.com/cards</span></div>`;
}
let html = '';
if (f === 'story') {
  if (v === 'card') {
    const w = 424, x = (540 - w) / 2, y = 244;
    html += openEnvelope(w * 1.012, x - 2, y - 8, 3.2);
    html += cardFront(w, x, y, -3);
    html += slip(122, 776, -1.6, 296, 54, 13.5, 13.5);
  } else if (v === 'note') {
    const w = 330;
    html += openEnvelope(350, 96, 276, 5);
    html += cardFront(w, 26, 118, -4.5);
    html += cardBack(w, 184, 412, 3.5);
    html += slip(26, 806, -2.2, 250, 50, 12, 12.5);
  } else {
    const w = 460, x = (540 - w) / 2, y = 190;
    html += shutEnvelope(w, x, y, -2.4, 136);
    html += `<div class="mark" style="--mf:21px;left:96px;top:506px;transform:rotate(-7deg)">Do not open<br>until Christmas</div>`;
    html += slip(122, 776, -1.6, 296, 54, 13.5, 13.5);
  }
} else if (f === 'post') {
  if (v === 'card') {
    const w = 368, x = (540 - w) / 2, y = 118;
    html += openEnvelope(w * 1.012, x - 2, y + 2, 3);
    html += cardFront(w, x, y, -2.6);
    html += slip(139, 606, -1.2, 262, 46, 12, 12);
  } else if (v === 'note') {
    const w = 258;
    html += openEnvelope(286, 127, 158, 2.5);
    html += cardFront(w, 16, 112, -3.2);
    html += cardBack(w, 266, 124, 2.8);
    html += slip(139, 612, -1.2, 262, 46, 12, 12);
  } else {
    const w = 410, x = (540 - w) / 2, y = 62;
    html += shutEnvelope(w, x, y, -2.2, 122);
    html += `<div class="mark" style="--mf:18px;left:118px;top:352px;transform:rotate(-7deg)">Do not open<br>until Christmas</div>`;
    html += slip(139, 606, -1.2, 262, 46, 12, 12);
  }
} else {
  // The picture a link shows on Facebook or in a message.
  const w = 196, x = 44, y = 66;
  html += openEnvelope(w * 1.012, x - 1, y + 6, 3);
  html += cardFront(w, x, y, -3);
  html += `<div class="side" style="left:294px;top:58px;width:280px"><div style="font:29px/1.3 var(--hand);color:#fbf1dc">${C.caption}</div><div style="font:600 12px/1 var(--serif);letter-spacing:.24em;margin-top:24px;color:#e8d3a4">PANTOPUS POST</div><div style="font:15px/1.42 var(--serif);margin-top:9px;color:rgba(246,236,217,.84)">A Christmas card that feels like real mail. Send one at pantopus.com/cards</div></div>`;
}
art.insertAdjacentHTML('beforeend', html + '<div id="light"></div><div id="vig"></div><div id="grain"></div>');
</script></body></html>
