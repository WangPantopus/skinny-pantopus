# --- Performance ---
# Android Lint runs inside the Gradle daemon. 4096m held while master and
# feature/calendarly were separate trees; the merged module carries both the
# RN->native parity screens and the Calendarly scheduling surface, and
# lintAnalyzeDebug then dies with "Java heap space". 6144m clears it with
# room to spare on a 16 GB CI runner. Since the Crew Day screens the Kotlin
# compiler runs in this process too (see kotlin.compiler.execution.strategy
# below), hence 10240m: one heap for lint and compile in turn.
org.gradle.jvmargs=-Xmx10240m -Xss16m -XX:+UseParallelGC -XX:NewRatio=3 -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- AndroidX ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# --- Kotlin ---
kotlin.code.style=official
kotlin.incremental=true
# 4096m started failing with "Back-end (JVM) Internal error: Couldn't transform
# method node" / OutOfMemoryError in the ASM frame analyzer as the Compose
# surface area grew. The composable it dies on is not itself large (52 lines) —
# the pressure is cumulative across the module, so this is a heap bump rather
# than a code split. -Xss16m keeps the deeply-nested Compose trees off the
# stack-overflow path at the same time. 6144m held on master; folding in the
# Calendarly scheduling surface (~70 more Compose screens) pushed it over
# again, hence 8192m.
# A separate 8192m Kotlin daemon beside the 6144m Gradle process stopped fitting
# a 16 GB CI runner once the Crew Day screens landed (Nov 2026): CI's
# "Lint, test, assemble" swapped in compileDebugKotlin for 50+ minutes or died
# with OutOfMemoryError, while the instrumented job, which runs no lint before
# compiling, built the same tree. Compiling inside the Gradle process keeps one
# heap (as the launch kit's local builds have always run this module), and the
# daemon settings below apply only if someone switches the strategy back.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx8192m -Xss16m -XX:+UseParallelGC -Dfile.encoding=UTF-8
ksp.incremental=true
