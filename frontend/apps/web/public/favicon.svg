<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pantopus">
  <!--
    The perforation mark. Tabs render this at 16px, where the check is
    illegible, so the small-size plug stands in for it. The window and the
    eight perforations stay knocked out — the tab background shows through.
  -->
  <mask id="pt-stencil" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <rect width="64" height="64" fill="#000"/>
    <rect x="4" y="4" width="56" height="56" rx="13" fill="#fff"/>
    <circle cx="23.5" cy="4" r="4.5" fill="#000"/><circle cx="40.5" cy="4" r="4.5" fill="#000"/>
    <circle cx="23.5" cy="60" r="4.5" fill="#000"/><circle cx="40.5" cy="60" r="4.5" fill="#000"/>
    <circle cx="4" cy="23.5" r="4.5" fill="#000"/><circle cx="4" cy="40.5" r="4.5" fill="#000"/>
    <circle cx="60" cy="23.5" r="4.5" fill="#000"/><circle cx="60" cy="40.5" r="4.5" fill="#000"/>
    <rect x="20" y="20" width="24" height="24" rx="4" fill="#000"/>
  </mask>
  <rect width="64" height="64" fill="#0284C7" mask="url(#pt-stencil)"/>
  <rect x="26" y="26" width="12" height="12" rx="3" fill="#0284C7"/>
</svg>
