# SAM deployment configuration for pantopus-seeder
#
# Usage:
#   sam build && sam deploy --config-env dev      # deploys dev
#   sam build && sam deploy --config-env staging   # deploys staging
#   sam build && sam deploy --config-env prod      # deploys production

version = 0.1

# ── Dev ──
[dev.build.parameters]
template_file = "template.yaml"

[dev.deploy.parameters]
stack_name = "pantopus-seeder-dev"
region = "us-west-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
parameter_overrides = "Environment=dev"
disable_rollback = true

# ── Staging ──
[staging.build.parameters]
template_file = "template.yaml"

[staging.deploy.parameters]
stack_name = "pantopus-seeder-staging"
region = "us-west-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
parameter_overrides = "Environment=staging"
disable_rollback = true

# ── Production ──
[prod.build.parameters]
template_file = "template.yaml"

[prod.deploy.parameters]
stack_name = "pantopus-seeder-production"
region = "us-west-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
# Matches production after the founder-approved Mailbox activation on 2026-11-06.
# Preserve the existing capacity monitoring and backend instance on later deploys.
# Sports and no-bid remain off; all other launch-cut features keep their own flags.
parameter_overrides = "Environment=production SchedulesEnabled=false BriefingsEnabled=true SeederEnabled=true HomeRemindersEnabled=true AlertsEnabled=true MailEnabled=true MaintenanceJobsEnabled=true PaymentJobsEnabled=true HealthMonitoringEnabled=true CapacityMonitoringEnabled=true BackendInstanceId=i-0e2c5c6441718bc4c"
disable_rollback = false
